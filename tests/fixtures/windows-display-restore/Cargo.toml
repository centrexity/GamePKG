[package]
name="gamepkg-windows-display-restore-check"
version="0.0.1"
edition="2021"
publish=false

[workspace]

[dependencies]
windows-sys={version="=0.52.0",features=["Win32_Foundation","Win32_System_Power","Win32_UI_WindowsAndMessaging"]}
tracing="=0.1.44"
winit={path="../../../vendor/winit",default-features=false,features=["rwh_06"],optional=true}
wgpu={version="=24.0.5",default-features=false,features=["wgsl"],optional=true}
pollster={version="=0.4.0",optional=true}

[features]
vulkan = ["dep:winit", "dep:wgpu", "dep:pollster"]

[[bin]]
name = "vulkan-cycle"
path = "src/bin/vulkan_cycle.rs"
required-features = ["vulkan"]
