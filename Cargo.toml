[package]
name = "gamepkg"
version = "0.1.14"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Source-first game package validation and archive tooling"

default-run = "gamepkg"

[features]
default = []
gui = ["dep:eframe", "dep:gilrs", "dep:rfd", "dep:pollster", "audio"]
audio = ["dep:cpal"]

[[bin]]
name = "gamepkg"
path = "src/main.rs"

[[bin]]
name = "gamepkg-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[dependencies]
cpal = { version = "0.18.2", optional = true }
wit-component = "=0.236.1"
wit-parser = "=0.236.1"
wasmparser = "=0.236.1"
naga = { version = "=24.0.0", features = ["spv-in", "wgsl-in", "glsl-out", "wgsl-out"] }
wasmtime = { version = "36.0.17", default-features = false, features = ["cranelift", "runtime", "std", "component-model"] }
image = { version = "0.25", default-features = false, features = ["png"] }
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "wgpu", "x11", "wayland"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
getrandom = "=0.3.4"
libc = "0.2"
zip = { version = "2", default-features = false, features = ["zstd"] }
ed25519-dalek = "2"
proc-macro2 = "1"
syn = { version = "2", features = ["full", "visit"] }

url = "2"
semver = "1"
tempfile = "3"
rustc_lexer = "=0.1.0"
pollster = { version = "=0.4.0", optional = true }
rfd = { version = "=0.17.2", optional = true }

[dev-dependencies]
wat = "1"

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
gilrs = { version = "=0.10.10", optional = true, default-features = false, features = ["xinput"] }
