[package]
name = "gamepkg"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Source-first game package validation and archive tooling"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["zstd"] }
ed25519-dalek = "2"
syn = { version = "2", features = ["full", "visit"] }

[dev-dependencies]
tempfile = "3"
