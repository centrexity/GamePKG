[package]
name = "gamepkg"
version = "0.1.24"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Source-first game package validation and archive tooling"

default-run = "gamepkg"

[features]
default = []
gui = ["dep:egui-winit", "dep:eframe", "dep:gilrs", "dep:rfd", "dep:pollster", "dep:wgpu-types", "audio"]
audio = ["dep:cpal"]

[profile.native-service]
inherits = "release"
lto = false

[[bin]]
name = "gamepkg"
path = "src/main.rs"

[[bin]]
name = "gamepkg-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[dependencies]
gamepkg-native-input = { path = "engines/native-input" }
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
egui-winit = { version = "=0.31.1", optional = true, default-features = false }
cpal = { version = "0.18.2", optional = true }
wit-component = "=0.236.1"
wit-parser = "=0.236.1"
wasmparser = "=0.236.1"
naga = { version = "=24.0.0", features = ["spv-in", "wgsl-in", "glsl-out", "wgsl-out"] }
wasmtime = { version = "36.0.20", default-features = false, features = ["cranelift", "runtime", "std", "component-model"] }
image = { version = "0.25", default-features = false, features = ["png"] }
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "wgpu", "x11", "wayland"] }
wgpu-types = { version = "=24.0.0", optional = true, features = ["serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
getrandom = "=0.3.4"
libc = "0.2"
zip = { version = "=9.0.5", default-features = false, features = ["zstd", "deflate-flate2"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }
ed25519-dalek = "2"
proc-macro2 = "1"
syn = { version = "2", features = ["full", "visit"] }

url = "2"
semver = "1"
tempfile = "3"
rustc_lexer = "=0.1.0"
rustc-demangle = "=0.1.27"
pollster = { version = "=0.4.0", optional = true }
rfd = { version = "=0.17.2", optional = true }
socket2 = "=0.6.3"

[dev-dependencies]
wat = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Storage_FileSystem"] }
gamepkg-takedawn-windows-runner = { path = "engines/takedawn/windows-runner" }

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
gilrs = { version = "=0.10.10", optional = true, default-features = false, features = ["xinput"] }

[patch.crates-io]
naga = { path = "vendor/naga" }
egui = { path = "vendor/egui" }
winit = { path = "vendor/winit" }
egui-winit = { path = "vendor/egui-winit" }
wgpu-hal = { path = "vendor/wgpu-hal" }

[[example]]
name = "service-window"
path = "examples/maintainer/service_window.rs"
required-features = ["gui"]

[[example]]
name = "native-service-runtime"
path = "examples/maintainer/native_service_runtime.rs"
required-features = ["gui"]

[[example]]
name = "native-tick-game"
path = "examples/maintainer/native_tick_game.rs"
required-features = ["gui"]
