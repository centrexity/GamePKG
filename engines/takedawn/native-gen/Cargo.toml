[package]
name = "gamepkg-takedawn-native-gen"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0 AND MIT AND BSD-3-Clause AND LGPL-2.1-or-later"
publish = false

[dependencies]
anyhow = "1"
capstone = { version = "=0.14.0", default-features = false, features = ["std", "full", "arch_x86"] }
gamepkg-takedawn-media = { path = "../media-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
