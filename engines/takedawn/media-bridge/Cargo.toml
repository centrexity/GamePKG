[package]
name = "gamepkg-takedawn-media"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
