status = "transport_job_and_actual_windows32_windows64_confinement_verified_product_integration_pending"
notes = "The Windows runner adds generic worker and compiler-tool launch APIs with explicit stdio handles, a cleared environment, no raw disc/restart capability, suspended creation and job assignment before execution. Single game workers permit one process; compiler tools may run up to 16 contained linker processes. Both require an AppContainer and a positive representable job-wide memory limit. Parent channels use private random local named pipes with overlapped I/O, retain each buffer/OVERLAPPED through cancellation completion and discard the channel after any operation failure. Three transport tests cover fragmented binary exchange, stalled reads and blocked 8 MiB writes. A real child test covers bidirectional binary stdio, separate stderr and job cleanup; an environment test covers double termination and absence of the disc capability. Six selected cases pass in both PE64 and PE32 under a private Wine prefix, and strict cross-target lint passes. The first actual Windows32/64 run executes these tests but fails before the confinement fixture body with CreateProcess error 203: its cleared environment omitted LOCALAPPDATA. Confined launches now require explicit absolute LOCALAPPDATA and SystemRoot paths; pure rejection/acceptance cases cover this contract. The native test pairs unconfined positive controls with worker/tool AppContainers for file/network denial and their distinct process limits. Actual Windows run 40635162708 confirms launch after that fix, then fails its networking canary because listener binding alone does not prove communication. The corrected live-connection canary uses an unconfined positive control and passes on actual Windows MSVC32 and MSVC64 in the entirely successful run 40636342968. All stream, media, runtime, standalone-tool, driving-input and native-critical-section jobs in that run pass. Existing ISO-managed runner behavior is retained. These APIs are groundwork for the ordinary-game Windows builder/session, not evidence that generic native Windows games are enabled: product integration, standalone generic compilation, actual Windows confinement and end-to-end games remain required."

