[[work]]
id = "arkanoo_parity"
requirements = ["Editor", "Mouse controls", "Original menus and music", "Portal and gravity mechanics", "Accurate endless generation", "Run persistence", "Original artwork and effects where licensing permits", "Original world geometry and physics", "Editor block types and full bonus/life rules", "Uncapped original level progression"]
status = "in_progress"
notes = "Gravity force/spin steps match six trajectories compiled directly from the pinned original fragment. Removed the old velocity clamps that made the original speed-triggered portal unreachable. Added one-time 3600 px/s activation/5000-point award, orbital balls, dynamic inward block positions, integer pull rounding, 270-frame completion and per-level reset. Pause now freezes the animation clock and absorption. Gravity toggles through V/controller X and persists in the legacy ARK1 reserved word. Actual native/Wasm fixtures verify production portal physics/rendering, gravity reload and paused frames; both browser profiles verify gravity input/persistence and normal play. Ball-to-ball responses now match seven fixtures compiled from the unchanged upstream contact block, including strict boundaries, exact coincidences, simultaneous pairs and portal exclusion. Original world proportions, single-step unattached movement, SDL integer collision rectangles and movement/pair/paddle/block/rocket/bonus cleanup ordering are restored. Independent unchanged ball/paddle fragments and real SDL intersections verify trajectories, edge cases, centered long-paddle activation/expiry and both-direction clamping. Actual native/Wasm fixtures verify brick resolution and pair-before-paddle ordering. Shockwave particle lifetimes/shapes, launch/bonus timing, rocket blast selection, life/level behavior, editor block types, original level progression and entity limits need further work alongside editor/mouse/menu/music/endless/run-save/art fidelity."


[[work]]
id = "2048_parity"
requirements = ["Accurate randomized tile spawning", "Scoring", "Win and game-over flow", "Restart and undo", "Board persistence", "Solver functionality", "Tile representation fidelity"]
status = "implemented_runtime_verified"
notes = "Original spawn/move rules, merge/best scoring, 128-step undo/restart, win/continue/game-over UI, portable saved board/history and extended tile exponents are verified. Cooperative expectimax assistance/autoplay retains CLI evaluator weights, adaptive depth, four probability, branch cutoff and tie handling without fallback search depth. A bounded 32768-position memo table leaves uncached branches searchable. Six independent fixtures from the unchanged pinned original executable match decisions and evaluations; cooperative chunk sizes and all depth tiers agree. A complete deterministic regression reaches 2048 after 932 turns, score 20676, checking legality, tile mass, scores and save round-trip. Actual native/Wasm and both browser profiles verify assistance/autoplay controls, stop/undo, win pause/continue, responsive cancellation, shared saves, damaged-save preservation and denied saving. Browser actions and Restart match the desktop input contract. Final signed package/catalog delivery and broader platform verification remain tracked separately."

