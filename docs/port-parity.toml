requirements = ["Game/creator/library-scoped window settings", "Normal size, fullscreen and maximized restore", "Preserve normal bounds across fullscreen/maximize/minimize", "Actual window and OS close handling", "Bounded records and damaged-data preservation", "Per-game storage accounting"]
status = "implemented_runtime_verified_linux"
notes = "Host-only atomic records restore actual native window state without guest filesystem access. Actual private-desktop tests cover resize, F11, fullscreen and maximized/fullscreen relaunch, normal-size restoration, game/OS close, library isolation, 100%/150% interface scaling without size drift and corrupt-record fallback. Fixed window-manager startup maximization and deferral until leaving restored fullscreen. Unit tests cover identity boundaries, invalid dimensions/schema/oversize, transient/minimized bounds, linked/device records and preserving damaged files; storage regressions include record bytes. Windows 32/64 compile checks pass, not Windows gameplay verification. Original menu display/resolution/VSync controls remain separate work."

