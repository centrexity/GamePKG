status = "reproduced_fixed_full_wrapper_sequence_sanitized32_64_and_runtime_verified_linux"
notes = "A production-wrapper regression reproduced a stale temporary-save length after wb reopen, partial overwrite and capacity failure: failed close left the prior length, allowing rename to replace a valid slot with partially overwritten bytes. The virtual wb open now truncates the published temporary length only after successfully acquiring a handle. Tracing original G_DoSaveGame also showed fclose failure is followed by removing the old slot before rename; a second pre-fix regression reproduced that deletion. Slot removal now returns EIO after sticky storage_error, preserving the old slot while the engine reports its storage failure. Tests execute this full remove/rename failure sequence and compare original slot length/bytes, require invalid temporary length and rejected commit, verify empty rewrites cannot commit and exercise a later successful rewrite after test-controlled error reset. Existing eight-handle, scoped-name/attack, six-slot/bundle, config staging and quota tests remain included. Address/undefined/leak sanitizers and actual pointer-asserted 32-bit execution with undefined-behavior traps pass. The standalone local 32-bit compiler initially lacked the multiarch asm errno header search; adding the existing system header directory fixed compilation without changing test behavior. CI adds the same 32-bit corpus/header path. Fresh private native and Wasm builds pass original saves/load/resume, map music transitions, linked chaingun, controls/quit, mod rendering/collision/movement/malformed-patch checks and stale Wasm integrity repair. CLI/GUI release builds, strict all-target/all-feature lint and formatting pass. No new buffers, raised caps or user-library/media changes. This qualifies production virtual-file failure/commit state and normal engine integration, not whole-engine injected save-overflow or host-disk failure recovery; those broader failure scenarios and full parity remain open."

[[work]]
id = "doom_virtual_partial_reads_and_eof"
requirements = ["Consume final partial read elements", "Set EOF only after a short read", "Successful seek clears EOF", "Zero-length reads preserve state", "Independent libc reference"]
status = "reproduced_fixed_libc_differential32_64_and_both_runtime_targets_verified_linux"
notes = "The old virtual fread copied only whole elements, leaving a final partial element unconsumed, and feof equated position==length with EOF. An independent libc differential test reproduced the premature EOF. The production wrapper now copies all available requested bytes, returns only complete elements, marks EOF on a short nonzero read, leaves zero-size/count reads untouched and clears EOF on successful seek. A per-handle EOF flag adds state without changing resource caps or buffers. The corpus compares actual libc temporary files containing synthetic data against the production wrapper for 1,920 payload-length/element-size/count combinations, two successive reads each, byte-for-byte destinations including untouched guards, item counts, positions, EOF/error flags, zero-size/count reads, seek clearing and next-byte values. It passes address/undefined/leak sanitizers and actual pointer-asserted ELF32 with undefined-behavior traps; the existing failed-save preservation, slot/config/bundle, quota and path-attack corpus remains included. CI already executes this complete storage body on both widths. Libc temporary files exist only in the trusted test, never in game I/O or user media. Fresh private native/Wasm builds pass original WAD/config loading, mods/rendering/collision/movement, save/load/resume, map music transitions, linked chaingun, original controls/quit and stale Wasm integrity repair. CLI/GUI release builds, strict all-target/all-feature release lint and formatting pass. This qualifies tested read/EOF semantics within the existing restricted virtual-file API, not unrestricted stdio behavior or every malformed mod/campaign/platform; broader parity remains open."

