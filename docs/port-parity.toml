notes = "Original spawn/move rules, merge/best scoring, 128-step undo/restart, win/continue/game-over UI, portable saved board/history and extended tile exponents are verified. Cooperative expectimax assistance/autoplay retains CLI evaluator weights, adaptive depth, four probability, branch cutoff and tie handling without fallback search depth. A bounded 32768-position memo table leaves uncached branches searchable. Six independent fixtures from the unchanged pinned original executable match decisions and evaluations; cooperative chunk sizes and all depth tiers agree. A complete deterministic regression reaches 2048 after 932 turns, score 20676, checking legality, tile mass, scores and save round-trip. Actual native/Wasm and both browser profiles verify assistance/autoplay controls, stop/undo, win pause/continue, responsive cancellation, shared saves, damaged-save preservation and denied saving. Browser actions and Restart match the desktop input contract. Final signed package/catalog delivery and broader platform verification remain tracked separately."

