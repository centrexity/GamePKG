# Full scope from the 2026-10-17 source audit. Completion requires behavior tests.
objective = "Restore accurate feature behavior across every current port"
status = "in_progress"

[[work]]
id = "cube2_startup"
requirements = ["Original startup menus", "Saved HUD/console preferences", "Saved FPS preference"]
status = "implemented_runtime_verified"
notes = "Removed forced map/menu/HUD/FPS commands; added explicit bounded 60-second map-loading events. Desktop keys now use ordered press/release events. Original menu, console-selected gameplay and custom HUD/FPS preferences verified by tests/cube2_startup_gui.py. Removed the extra fixed host pacing limit."

[[work]]
id = "cube2_input"
requirements = ["Complete original keyboard controls", "Mouse buttons and relative input", "Controller and touch equivalents"]
status = "in_progress"
notes = "Desktop keyboard uses physical events rather than egui's normalized key subset, including Pause, keypad distinctions, international keys and left/right modifiers. The bounded protocol and engine release table now cover SDL's entire 512-entry scancode range; media/browser/application keys with SDL equivalents have explicit mappings. Accepted keyboard, paste and committed IME text stay ordered with keys; preedit text is not captured. Private actual-engine GUI tests verify original menus, console preferences, independent Pause/keypad-1/right-Ctrl/media-next bindings, focus transitions, release actions, saved configuration and normal close. Unit tests cover scancode boundaries, extended mappings and modifier sides; focused-viewport capture/text isolation and overflow tests pass. Initial OS lock-key state, remaining uncommon-key/platform behavior and full controller/touch equivalence remain open."

[[work]]
id = "cube2_network"
requirements = ["LAN discovery", "Master browsing/authentication", "Public server registration", "Scoped multiplayer permissions"]
status = "pending"
notes = "Adapter audit confirms broadcast enabling and listen/accept are rejected; reverse lookup is numeric. Bounded buffer/timeout/reuse/TTL settings now reach host UDP sockets and survive rebinding; error/TTL queries return host results. Production shim framing and real OS option values are tested. Shutdown remains a no-op. Existing bounded packet/framing tests do not establish discovery, authentication, server registration or complete disconnect/error semantics. Audit original callers and implement required host operations without relaxing signed network permissions."

[[work]]
id = "cube2_content"
requirements = ["Custom assets and mod loading", "Demo and movie outputs", "Scoped import/export and persistence"]
status = "pending"

[[work]]
id = "cube2_renderer_platforms"
