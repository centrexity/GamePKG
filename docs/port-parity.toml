# Full scope from the 2026-10-17 source audit. Completion requires behavior tests.
objective = "Restore accurate feature behavior across every current port"
status = "in_progress"

[[work]]
id = "cube2_startup"
requirements = ["Original startup menus", "Saved HUD/console preferences", "Saved FPS preference"]
status = "implemented_runtime_verified"
notes = "Removed forced map/menu/HUD/FPS commands; added explicit bounded 60-second map-loading events. Desktop keys now use ordered press/release events. Original menu, console-selected gameplay and custom HUD/FPS preferences verified by tests/cube2_startup_gui.py. Removed the extra fixed host pacing limit."

[[work]]
id = "cube2_input"
requirements = ["Complete original keyboard controls", "Mouse buttons and relative input", "Controller and touch equivalents"]
status = "in_progress"
notes = "Desktop keyboard uses physical events rather than egui's normalized key subset, including Pause, keypad distinctions, international keys and left/right modifiers. The bounded protocol and engine release table now cover SDL's entire 512-entry scancode range; media/browser/application keys with SDL equivalents have explicit mappings. Accepted keyboard, paste and committed IME text stay ordered with keys; preedit text is not captured. Private actual-engine GUI tests verify original menus, console preferences, independent Pause/keypad-1/right-Ctrl/media-next bindings, focus transitions, release actions, saved configuration and normal close. Unit tests cover scancode boundaries, extended mappings and modifier sides; focused-viewport capture/text isolation and overflow tests pass. X11 initial Caps/Num state and focus resynchronization now pass a private-desktop regression; Windows has a queue-state implementation but no runtime proof. Native Wayland lock state, rapidly queued X11 lock ordering, remaining uncommon-key/platform behavior and full controller/touch equivalence remain open."

[[work]]
id = "cube2_network"
requirements = ["LAN discovery", "Master browsing/authentication", "Public server registration", "Signed on/off networking"]
status = "in_progress"
notes = "Nonblocking host TCP now implements connect/bind/listen/accept/poll, socket options/errors, partial transfers and shutdown. UDP bind/connect/shutdown uses actual socket state. The synchronous list browser explicitly selects the sanitized snapshot; ordinary streams no longer masquerade as list-only sockets. Original private-master registration, UDP information ping, cryptographic challenge/response, authenticated privilege and auth.cfg save/reload pass. Private IPv4 Ethernet broadcast discovery, original browser row-click join, wrong-key rejection, unrelated-response denial and corrected-key retry are now verified. Further network/platform coverage, registration refusal/retry, master backoff and service interoperability remain open. Fixed shared quotas and signed on/off networking remain enforced."

