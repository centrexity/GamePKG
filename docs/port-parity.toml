nd 5041-pattern collection edit/persistent reload, and release the parent budget. The existing 16 MiB parent, 3/7 MiB audio shares, 3891008 browser guest bytes, two 1200224-byte workspaces, export ceiling, voice counts and deadlines are unchanged. Seventeen current unchanged test bodies pass in a real i686 process, including the new 5940-case matrix; the sandbox initially killed the 32-bit syscall path and the identical executable check passes escalated. Final standard release suite passes 671 tests, zero failures, 151 ignored across 74 groups; all 120 port unit tests, strict all-target/all-feature release lint and formatting pass. Canonical native and Wasm each pass all 71 gameplay/audio/save/pixel regressions after the renderer change. CI includes the complete private desktop/browser reproduction. Original upstream, user libraries, ROMs and real keys are untouched; all recordings/packages/proof images stay private. Canonical recorded-audio activation, composition-dependent/supported/flagged or otherwise unproven giant clusters, whole-host/browser memory accounting and broader platform/hardware parity remain open; this does not establish every possible Unicode name or full game parity."

