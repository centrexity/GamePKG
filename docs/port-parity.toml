[[work]]
id = "arkanoo_editor"
requirements = ["Original grid paint/erase behavior", "All normal and special brick choices", "Named pattern save/load", "Clear confirmation", "Test game and editor return", "Custom endless pattern pool", "ASCII pattern compatibility", "Scoped external import/export", "Original editor art/fonts and full text input"]
status = "in_progress"
notes = "Restored editor accessible with E at title/pause, pointer toolbar and original S/C/T/L/N/0-8/arrow/Enter/Escape shortcuts. Complete unchanged original editor fixtures verify boundaries, duplicate painting, both-button drag priority, brick types/health, clear, ASCII parsing/writing, backspace and background cycling. All 106 custom-pool layouts match the unchanged original generator and pattern converter on native and wasm32, including three custom selections and empty/special boards. ARK3 archives preserve legacy metadata/effects preferences and named patterns within the existing 1 MiB scoped save; truncation, invalid UTF-8/cells/counts, oversized data, storage exhaustion and denied saving are tested without overwriting damaged saves. Active runs/unsaved edits, original art/fonts and full native IME/touch support remain open."

[[work]]
id = "selected_file_io"
requirements = ["Signed file-type permissions", "Explicit player selection", "Async native and browser import/export", "Opaque per-instance requests", "Permission/buffer/path/size validation", "Failed-tick rollback", "Cancellation and stale-result handling", "Original ASCII pattern integration"]
status = "implemented_runtime_verified"
notes = "Added bounded import/export APIs for core/component/native and browser hosts. Requests require a fresh focused input action and successful tick; the CLI defaults to unavailable. Native selection reads only chosen regular files and exports atomically to the chosen destination. Browser upload and Save/download actions remain outside the guest. One request/result is retained; native session tokens and browser generations reject stale replies. Original pattern import/export and >64 KiB archive reloading are integrated. Eighteen actual-runtime checks pass on native and wasm32, including component bindings, denied files, cancelled operations, invalid UTF-8, chunked reads and play-history failure rollback. Linux native Open/Save dialogs and core/component browser upload/download controls pass; this does not close engine mod/directory/streaming/large-recording requirements."

[[work]]
