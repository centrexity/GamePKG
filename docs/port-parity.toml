# Full scope from the 2026-10-17 source audit. Completion requires behavior tests.
objective = "Restore accurate feature behavior across every current port"
status = "in_progress"

[[work]]
id = "cube2_startup"
requirements = ["Original startup menus", "Saved HUD/console preferences", "Saved FPS preference"]
status = "implemented_runtime_verified"
notes = "Removed forced map/menu/HUD/FPS commands; added explicit bounded 60-second map-loading events. Desktop keys now use ordered press/release events. Original menu, console-selected gameplay and custom HUD/FPS preferences verified by tests/cube2_startup_gui.py. Removed the extra fixed host pacing limit."

[[work]]
id = "cube2_input"
requirements = ["Complete original keyboard controls", "Mouse buttons and relative input", "Controller and touch equivalents"]
status = "in_progress"
notes = "Desktop keyboard now uses physical events rather than egui's normalized key subset, including Pause, keypad distinctions, international keys and left/right modifiers. Accepted keyboard, paste and committed IME text stay ordered with those keys; preedit text is not captured. Private actual-engine GUI tests verify original menus, console preferences, independent Pause/keypad-1/right-Ctrl bindings and normal saving/close. Unit tests cover SDL scancodes and modifier sides; focused-viewport capture/text isolation and overflow tests pass. Extended media keys beyond the current SDL protocol range and full controller/touch equivalence remain open."

[[work]]
id = "cube2_network"
requirements = ["LAN discovery", "Master browsing/authentication", "Public server registration", "Scoped multiplayer permissions"]
status = "pending"

[[work]]
id = "cube2_content"
requirements = ["Custom assets and mod loading", "Demo and movie outputs", "Scoped import/export and persistence"]
status = "pending"

[[work]]
id = "cube2_renderer_platforms"
requirements = ["Accurate graphics with hardware acceleration", "Native portability beyond Linux"]
status = "pending"

[[work]]
id = "stereo_audio"
requirements = ["Channel-aware host audio", "Cube 2 stereo", "DOOM spatial separation", "Zelda stereo DSP", "Output and channel-isolation tests"]
status = "implemented_runtime_verified"
notes = "Shared stereo output and Cube 2 stereo verified: callback/encoding, protocol, resampling, original-engine channel differences, real null-device output, cached package playback and GUI rendering. Zelda preserves original DSP stereo through native and Wasm adapters; actual channel differences, gameplay, SRAM saving/reload, import-free engine and malformed/budget/permission handling verified. DOOM spatial stereo verified in native and Wasm original attract demos and gameplay/save-reload tests. Production mixer tests cover separation, gain, clipping, end/rate bounds and long-sound counter overflow. Music remains separate pending work."

[[work]]
id = "doom_music"
requirements = ["Original music playback", "Sound controls and persistence", "Music backend selection"]
status = "in_progress"
notes = "Original WAD music restored with pinned Chocolate DOOM sequencing/MUS/MIDI parsing and Nuked OPL synthesis using OPL2 defaults. Native and Wasm title-only music, original demo stereo and gameplay/save reload verified. All 45 songs in the selected DOOM WAD produce audio during their first three seconds with address/undefined-behavior sanitizers clean. Generated MIDI/MUS tests verify looping, volume reduction/restoration, pause/resume, tempo/callback bounds, truncations and 9,472 single-byte MIDI mutations; leak checks pass. Sound settings now persist and survive relaunch through the original menus in both targets. Full song/campaign coverage and backend selection remain unfinished."

[[work]]
id = "doom_saves_config_input"
requirements = ["All original save slots", "Saved configuration", "Full keyboard and mouse controls"]
status = "in_progress"
notes = "Six original save slots and both configuration files persist through a versioned, creator/game-scoped bundle. Native and Wasm original-menu tests cover all slots, distinct last-slot resume, sound-setting changes/reload, legacy raw-slot migration and >3 MiB bundle read/commit. Local desktop input work now passes actual native and Wasm tests for original bindings, save-name editing, legacy zero-binding migration, firing, Pause, weapon selection, wheel bindings, relative mouse movement and the original quit/ENDOOM flow. Restored ENDOOM retains character cells, colors and blinking; a typed upstream demo-exit wrapper fixes a Wasm indirect-call signature trap. C input/ending sanitizer checks, focused-viewport capture isolation and Rust input regressions pass. Private desktop GUI verification also passes ROM selection, separate game window, visible gameplay, physical keyboard movement/automap and named scoped saving. Broader control/platform coverage remains unfinished; do not treat this as complete parity."

