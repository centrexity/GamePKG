# Full scope from the 2026-10-17 source audit. Completion requires behavior tests.
objective = "Restore accurate feature behavior across every current port"
status = "in_progress"

[[work]]
id = "arkanoo_streamed_music_decoder"
requirements = ["Original compressed recordings", "Bounded streaming decode", "Matching native/browser PCM", "Original mixer conversion", "Playback and menu controls", "Shared memory accounting"]
status = "in_progress"
notes = "An import-free scalar Wasm decoder prototype streams all nine original MP3 tracks with fixed memory, bounded reads and native epoch deadlines without instruction fuel. Complete native passes are chunk-invariant and rewindable; Chromium matches full-track fingerprints and exact audible windows. SDL decoded lengths match, but some PCM values differ by one integer unit. An independent original Music API capture checks the codec reference at source and original 44.1 kHz rates. A shared fixed-ring converter now provides 44.1/48 kHz stereo output with chunk-invariant global integer phase; its complete float output matches actual SDL conversion bit-for-bit across 18 rate pairs. A separate original-mixer mode now reproduces signed-stereo 1,024-frame puts, retained padding, short-put staging and flush/truncation. Actual SDL_AudioStream matches every float bit and length across 306 rate/boundary cases; all nine complete original 44.1 kHz track lengths match and native/browser outputs agree. Stereo sources only; mono byte/frame scheduling and asynchronous game playback remain unverified. Decoder differences can propagate to two integer units after filtering. Exact-length reader loading now avoids a full duplicate encoded buffer; verified asset readers retain path/size checks and final CRC verification. All nine tracks also pass native/browser checks with declared/enforced 8 MiB and 6 MiB decoder ceilings, peaking at 5,373,952 native linear-memory bytes. Shared reservations prevent concurrent overcommit and budgeted loading holds the charge until store destruction. A private synthetically signed fixture now verifies complete loading of all nine tracks through real package asset readers at 6 MiB, including pre-verification denial; no extraction or publication of recordings. Browser encoded ArrayBuffer loading still needs streaming/accounting. Runtime guest/decoder/buffer/decompressor accounting, signed audio-permission integration, SDK calls and asynchronous playback remain open; no guest dependencies or game music playback are enabled by this prototype."

