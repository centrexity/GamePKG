[[work]]
id = "arkanoo_parity"
requirements = ["Editor", "Mouse controls", "Original menus and music", "Portal and gravity mechanics", "Accurate endless generation", "Run persistence", "Original artwork and effects where licensing permits", "Original world geometry and physics", "Editor block types and full bonus/life rules", "Uncapped original level progression"]
status = "in_progress"
notes = "Gravity force/spin steps match six trajectories compiled directly from the pinned original fragment. Removed the old velocity clamps that made the original speed-triggered portal unreachable. Added one-time 3600 px/s activation/5000-point award, orbital balls, dynamic inward block positions, integer pull rounding, 270-frame completion and per-level reset. Pause now freezes the animation clock and absorption. Gravity toggles through V/controller X and persists through legacy-compatible archives. Actual native/Wasm fixtures verify production portal physics/rendering, gravity reload and paused frames; both browser profiles verify gravity input/persistence and normal play. Ball-to-ball responses now match seven fixtures compiled from the unchanged upstream contact block, including strict boundaries, exact coincidences, simultaneous pairs and portal exclusion. Original world proportions, single-step unattached movement, SDL integer collision rectangles and movement/pair/paddle/block/rocket/bonus cleanup ordering are restored. Independent unchanged ball/paddle fragments and real SDL intersections verify trajectories, edge cases, centered long-paddle activation/expiry and both-direction clamping. Actual native/Wasm fixtures verify brick resolution and pair-before-paddle ordering. Per-ball 30-frame launch delays and all three directions, manual launch priority, independent host randomness, life-loss item preservation, single-life recovery on completion, ninth-level victory/endless flow and level resets now match unchanged original fragments. Removed four-ball/nine-ammo/four-rocket/eight-drop/score-9999999/level-999 port caps. Actual native/Wasm tests cover launch timing, preserved bonuses, victory, level 1000 and large legacy ARK1 scores. Normal/ice/explosive/metal brick health, ghost behavior and metal-aware completion are restored. Rockets use original 120-pixel world-distance blasts and explosive bricks use 60; indirect damage bypasses armor, never chains or drops bonuses. Ten unchanged-original SDL-backed fixtures cover phase ordering, boundaries, repeated hits and multiple rockets. Native/Wasm checks verify visible ice damage, all special types, blast exclusions and 200-special-brick rendering within normal budgets. Special bricks remain disabled in procedural generation just as upstream; the editor and saved custom patterns expose them. Original ASCII pattern-file import/export now uses explicit player-selected files. All twelve original procedural level types, level/attempt and per-cell/mirror seeding, density/parameter sampling and 20-block/10-retry rules now match the complete unchanged original generator with pinned rand 0.8.5. Fixed-width scalar ChaCha12/PCG sampling preserves canonical 64-bit layouts on native and wasm32 without guest crates. Independent fixtures cover 106 complete layouts including five low-density retries and u32::MAX, plus stream and distribution vectors. Actual native and wasm32 runtimes match all 106 rendered boards and coordinates. Saved custom patterns now join the endless pool; original ASCII import/export now uses signed, host-mediated file selection. Original shard lifetime/rotation/gravity/alpha/shape and launch/brick/record/portal bursts are restored without the old 64-particle cap. Original ball history trails and regular/super fireball effects are restored with point/color reference checks. Original penguin/heart-loss state and rectangle art, including final-life freezing and the original heart PNG, are restored; remaining visual effects still need work alongside original menu/music/run-save/art fidelity. Focused ordered pointer/key/text input now passes through a bounded permission-gated SDK across core, component, native and browser hosts. Mouse centering/quantization, original Space/Escape actions and transition clicks are restored; browser Restart resets static game state. Gameplay cursor hiding/confinement, F11 fullscreen and Q-to-quit outside play now use bounded, transactional host controls; unit, native-window and both browser-profile tests verify actual fullscreen, cursor visibility/release and clean quitting. Host-owned normal-size/fullscreen/maximized window preferences now persist through the native host, including combined-mode reopen and original normal-size restoration in actual Linux desktop tests. The six main menu actions now work through original projected mouse rectangles, with Settings/fullscreen/back controls. Eighty-one button cases and 25 slider events match the complete unchanged original menu module. Actual native/core/component and native/browser-window checks cover activation. Remaining menu presentation and music/resolution/VSync controls, project-homepage action and initial modifier/lock state remain unfinished."


