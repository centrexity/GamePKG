[[work]]
id = "arkanoo_effects_settings"
requirements = ["Original effects-volume range/default and mute", "Integer pointer dragging and clamping", "Actual PCM gain and silence", "Preferences survive new game/restart/relaunch", "Legacy migration and full pattern capacity", "Denied/damaged-save warnings and data preservation", "Portable large-frame audio phase"]
status = "implemented_runtime_verified_linux_and_web"
notes = "Implemented 0–128 effects volume (64 default), independent mute and original slider behavior without guest dependencies. Packed ARK3 flags retain the existing 20-byte header and full 1 MiB pattern capacity; ARK1/ARK2 load with original effects defaults. Unit vectors cover 81 menu boundaries, 25 original slider events, all volume/mute states, bad/reserved flags, truncation and full archives. Actual native/core/component PCM verifies gain, mute/zero, restart/reopen, legacy migration and unavailable/damaged saves. Native and both browser profiles pass real drags/mute and browser rendered-state restoration. Fixed usize phase overflow; actual native/wasm32 samples at u32::MAX match a widened reference. Original recorded effects/music and non-Linux gameplay remain unverified/open."
