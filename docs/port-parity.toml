notes = "Verified v14 baseline evidence (not a v15 Windows qualification): Current delivery uses the v14/0.1.3 recipe, requiring the unreleased 0.1.18 app and x64. It retains 24,003 prepared Rust game functions across 487 units and 24,035 native exports; the original platform runtime remains C/C++. Players require neither Python, C2Rust nor WSL. The full signed native Windows Build/repair gate passes in run 40446319498: all 487 units, ready-to-play recognition, intentionally corrupted SDL companion rejection, and repair preserving compiled unit hashes/timestamps. Native Windows/macOS host checks and verified Windows packaging pass at f87f383 in run 40581542080. Actual standalone Windows Rust compilation and original game Race/Crash, saved-profile reload, stereo capture, resize and close pass under Wine. Wine and asset-free host fixtures do not establish physical Windows original-game graphics, audio or controllers. Those hardware checks, broader campaign and multiplayer completion remain open. The earlier stream/constant normalization evidence remains historical provenance, not a replacement for the full build gate. See native-windows-gameplay-validation.md. Current development recipe0.1.4 uses source kit7f56741fa8f0a56d3e718af1f772bae9200514b6293c2d218e56cde700123c8b; only input policy/attachment differ fromv14 and all preparedRust remains unchanged. Sanitized213-case input tests pass at64bit and actualELF32, retaining15glyphfamilies. Normal signed v15 Linux cold Build compiles all487units in about62minutes without seeded objects and retains all24035exports. Integrity, wrong-disc rejection without saved selection/history, in-place selected and remembered ISO Play, increasing play history and deliberate executable corruption/repair pass. Repair preserves every unit hash/mtime, signed package, settings, ROM selection and player data. The exact repaired executable passes original Xbox Race/PS2 Crash and three split-screen XboxP1/NintendoP1/XboxP2 acceleration, held-button pause suppression and Resume cases under strict executed-path/actualVulkan gates with dummy audio and unchanged private references. These are control routes using virtual pads, not natural multiplayer finishes or physical controllers. The full Windowsv15 signed Build/repair now passes at b40bbbe in run40612591810, preserving all487 compiled unit hashes/timestamps and signed package identity; no media or gameplay is exercised. Physical Windows, mixed viewport prompts, natural multiplayer completion, fullcampaign/highermedals and broaderplatforms remain open."

