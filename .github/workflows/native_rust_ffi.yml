name: Native Rust engine stream ABI
on:
  push:
    paths: ['engines/takedawn/native-gen/tests/streaming*', 'vendor/winit/src/platform_impl/windows/definitions.rs', 'vendor/winit/src/platform_impl/windows/drop_handler.rs', 'tools/check_windows_drop_abi.py', 'tests/fixtures/windows-drop-abi/**', 'ports', 'tools/check_arkanoo_geometry.py', 'tools/generate_arkanoo_trig_reference.py', 'tests/fixtures/arkanoo-trig-f32.json', 'engines/takedawn/rust-port/**', 'engines/takedawn/media-bridge/**', 'engines/takedawn/windows-runner/**', 'tools/check_takedawn_input_glyphs.py', 'tools/check_takedawn_native_privileged.py', 'tools/takedawn_native_privileged.py', 'tools/check_takedawn_rust_stdio.py', 'tools/check_takedawn_rust_cache.py', 'tools/check_takedawn_windows_file.py', 'tools/check_takedawn_windows_kernel.py', 'tools/check_takedawn_windows_stream.py', 'tools/check_takedawn_windows_restart.py', 'tools/check_takedawn_windows_native_build.py', 'engines/takedawn/windows-dependencies.json', '.github/workflows/native_rust_ffi.yml']
  pull_request:
    paths: ['engines/takedawn/native-gen/tests/streaming*', 'vendor/winit/src/platform_impl/windows/definitions.rs', 'vendor/winit/src/platform_impl/windows/drop_handler.rs', 'tools/check_windows_drop_abi.py', 'tests/fixtures/windows-drop-abi/**', 'ports', 'tools/check_arkanoo_geometry.py', 'tools/generate_arkanoo_trig_reference.py', 'tests/fixtures/arkanoo-trig-f32.json', 'engines/takedawn/rust-port/**', 'engines/takedawn/media-bridge/**', 'engines/takedawn/windows-runner/**', 'tools/check_takedawn_input_glyphs.py', 'tools/check_takedawn_native_privileged.py', 'tools/takedawn_native_privileged.py', 'tools/check_takedawn_rust_stdio.py', 'tools/check_takedawn_rust_cache.py', 'tools/check_takedawn_windows_file.py', 'tools/check_takedawn_windows_kernel.py', 'tools/check_takedawn_windows_stream.py', 'tools/check_takedawn_windows_restart.py', 'tools/check_takedawn_windows_native_build.py', 'engines/takedawn/windows-dependencies.json', '.github/workflows/native_rust_ffi.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  streams:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            arch: x64
          - os: windows-2022
            target: i686-pc-windows-msvc
            arch: x86
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Verify resumable compilation with native Rust objects
        run: python tools/check_takedawn_rust_cache.py --target ${{ matrix.target }}
      - name: Compare native port geometry with original captures
        run: python tools/check_arkanoo_geometry.py --target ${{ matrix.target }}
      - name: Compare converted Rust with the native platform C runtime
        run: python tools/check_takedawn_rust_stdio.py --target ${{ matrix.target }}
      - name: Test the actual Rust verified-disc reader and media bridge
        run: cargo test --locked --manifest-path engines/takedawn/media-bridge/Cargo.toml --target ${{ matrix.target }}
      - name: Verify native process ownership and inherited ISO handles
        if: runner.os == 'Windows'
        run: |
          cargo test --locked --manifest-path engines/takedawn/windows-runner/Cargo.toml --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path engines/takedawn/windows-runner/Cargo.toml --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: Verify production drop callbacks against native Windows SDK headers
        if: runner.os == 'Windows'
        run: python tools/check_windows_drop_abi.py --target ${{ matrix.target }}
      - name: Compare the read-only disc adapter with native Windows file APIs
        if: runner.os == 'Windows'
        run: python tools/check_takedawn_windows_file.py --target ${{ matrix.target }}
      - name: Verify native startup and SDL streams without extracted assets
        if: runner.os == 'Windows'
        run: python tools/check_takedawn_windows_stream.py --target ${{ matrix.target }}
      - uses: actions/checkout@v4
        if: runner.os == 'Windows'
        with:
          repository: xenophobentx/xboxrecomp
          ref: 5ae8ad90d984425e834dee759592c15592679880
          path: target/windows-kernel-reference
          persist-credentials: false
      - name: Compile the pinned original Windows file runtime through the adapter
        if: runner.os == 'Windows'
        run: |
          python tools/check_takedawn_windows_kernel.py --source target/windows-kernel-reference --target ${{ matrix.target }}
      - name: Verify original teardown and managed Windows restart
        if: runner.os == 'Windows'
        run: python tools/check_takedawn_windows_restart.py --source target/windows-kernel-reference --target ${{ matrix.target }}
      - name: Build and run with the standalone native Windows SDK
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        run: python tools/check_takedawn_windows_native_build.py
      - name: Verify preparation transformations and rejected layouts
        if: runner.os == 'Linux'
        run: |
          cargo test --locked --manifest-path engines/takedawn/rust-port/Cargo.toml
          cargo fmt --manifest-path engines/takedawn/rust-port/Cargo.toml -- --check
          cargo clippy --locked --manifest-path engines/takedawn/rust-port/Cargo.toml --all-targets -- -D warnings
      - name: Check preserved streaming instruction oracle on the native runner
        if: runner.os == 'Linux'
        run: |
          lscpu
          cargo test --locked --release --manifest-path engines/takedawn/native-gen/Cargo.toml --test streaming
      - name: Verify Windows CMake argument normalization
        if: runner.os == 'Linux'
        run: |
          mkdir -p target
          rustc --edition=2021 -Dwarnings --test engines/takedawn/rust-port/build-windows-runtime.rs -o target/takedawn-windows-paths
          target/takedawn-windows-paths
      - name: Verify driving prompts against original input mapping
        if: runner.os == 'Linux'
        run: python3 tools/check_takedawn_input_glyphs.py

  native-critical-sections:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: actions/checkout@v4
        with:
          repository: xenophobentx/xboxrecomp
          ref: 5ae8ad90d984425e834dee759592c15592679880
          path: target/irq-kernel-reference
          persist-credentials: false
      - name: Install native IRQ fixture prerequisites
        run: bash tools/ci_ubuntu_apt.sh update && bash tools/ci_ubuntu_apt.sh install -y cmake ninja-build libssl-dev libsdl2-dev libepoxy-dev
      - name: Verify real kernel masking, native Rust bindings and rejected mutations
        run: python3 tools/check_takedawn_native_privileged.py --toolkit target/irq-kernel-reference --without-vulkan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-critical-section-evidence
          path: |
            /tmp/gamepkg-native-privileged.*/*.log
            /tmp/gamepkg-native-privileged.*/*.json
          retention-days: 3
