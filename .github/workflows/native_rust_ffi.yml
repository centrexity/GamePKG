name: Native Rust engine stream ABI
on:
  push:
    paths: ['engines/takedawn/rust-port/**', 'tools/check_takedawn_rust_stdio.py', '.github/workflows/native_rust_ffi.yml']
  pull_request:
    paths: ['engines/takedawn/rust-port/**', 'tools/check_takedawn_rust_stdio.py', '.github/workflows/native_rust_ffi.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  streams:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            arch: x64
          - os: windows-2022
            target: i686-pc-windows-msvc
            arch: x86
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Compare converted Rust with the native platform C runtime
        run: python tools/check_takedawn_rust_stdio.py --target ${{ matrix.target }}
      - name: Verify preparation transformations and rejected layouts
        if: runner.os == 'Linux'
        run: |
          cargo test --locked --manifest-path engines/takedawn/rust-port/Cargo.toml
          cargo fmt --manifest-path engines/takedawn/rust-port/Cargo.toml -- --check
          cargo clippy --locked --manifest-path engines/takedawn/rust-port/Cargo.toml --all-targets -- -D warnings
