name: Native Windows game graphics
on:
  push:
    paths:
      - 'src/storage.rs'
      - 'src/storage/**'
      - 'tests/storage.rs'
      - 'src/gui.rs'
      - 'src/bin/gui.rs'
      - 'src/gpu*.rs'
      - 'src/runtime.rs'
      - 'src/native/**'
      - 'src/port_host/**'
      - 'vendor/wgpu-hal/src/vulkan/**'
      - 'engines/native-services/**'
      - 'src/shaders.rs'
      - 'src/windows_compiler.rs'
      - 'engines/native/**'
      - 'engines/native-services/windows-runner/**'
      - 'tests/windows_native_gui.py'
      - 'tests/port_services_vulkan.rs'
      - 'tests/fixtures/windows_native_*'
      - 'tests/fixtures/service_textured_v2.rs'
      - 'tests/textured_v2_pins.rs'
      - 'tests/windows_owned_window.py'
      - 'tests/windows_gui_support.py'
      - 'tests/windows_graphics_capture.py'
      - 'tests/reference/windows-native-graphics/**'
      - 'tools/build_release.rs'
      - 'tools/native_service_sdk.py'
      - 'tools/package_release.py'
      - 'tools/windows_pe_imports.py'
      - 'tests/package_architecture.py'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/native_windows_graphics.yml'
  pull_request:
    paths:
      - 'src/storage.rs'
      - 'src/storage/**'
      - 'tests/storage.rs'
      - 'src/gui.rs'
      - 'src/bin/gui.rs'
      - 'src/gpu*.rs'
      - 'src/runtime.rs'
      - 'src/native/**'
      - 'src/port_host/**'
      - 'vendor/wgpu-hal/src/vulkan/**'
      - 'engines/native-services/**'
      - 'src/shaders.rs'
      - 'src/windows_compiler.rs'
      - 'engines/native/**'
      - 'engines/native-services/windows-runner/**'
      - 'tests/windows_native_gui.py'
      - 'tests/port_services_vulkan.rs'
      - 'tests/fixtures/windows_native_*'
      - 'tests/fixtures/service_textured_v2.rs'
      - 'tests/textured_v2_pins.rs'
      - 'tests/windows_owned_window.py'
      - 'tests/windows_gui_support.py'
      - 'tests/windows_graphics_capture.py'
      - 'tests/reference/windows-native-graphics/**'
      - 'tools/build_release.rs'
      - 'tools/native_service_sdk.py'
      - 'tools/package_release.py'
      - 'tools/windows_pe_imports.py'
      - 'tests/package_architecture.py'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/native_windows_graphics.yml'
  workflow_dispatch:
    inputs:
      hardware:
        description: Run visible-window tests on a trusted Windows hardware Vulkan runner
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-windows-graphics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-graphics:
    # Hosted runners do not promise hardware Vulkan. Never send pull-request
    # code (or a manually chosen branch) to the interactive self-hosted runner.
    if: ${{ !inputs.hardware || github.ref == 'refs/heads/main' }}
    runs-on: ${{ fromJSON(inputs.hardware && '["self-hosted", "Windows", "X64", "gamepkg-vulkan"]' || '["windows-2022"]') }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            architecture: x86_64
            shader-backend: wgsl
          - target: i686-pc-windows-msvc
            architecture: i686
            shader-backend: spirv
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-windows-graphics-${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare locked compatibility source bundle
        shell: pwsh
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdk = Join-Path $env:RUNNER_TEMP 'native-service-sdk.tar.gz'
          $pin = python tools/native_service_sdk.py $sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "GAMEPKG_NATIVE_SDK_SHA256=$pin" >> $env:GITHUB_ENV
          "GAMEPKG_NATIVE_SDK_ARCHIVE=$sdk" >> $env:GITHUB_ENV
      - name: Build the native CLI and game window with embedded audio companions
        shell: pwsh
        run: |
          rustc --edition=2021 --target ${{ matrix.target }} tools/build_release.rs -o gamepkg-build-release.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./gamepkg-build-release.exe --github-env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force target/share/gamepkg | Out-Null
          Copy-Item $env:GAMEPKG_NATIVE_SDK_ARCHIVE target/share/gamepkg/native-service-sdk.tar.gz
      - name: Verify sparse storage allocation at the app executable width
        shell: pwsh
        run: |
          cargo test --locked --release --target ${{ matrix.target }} --test storage -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare screenshot tools and verify window capture helpers
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/windows_graphics_capture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run shared Vulkan pixel tests on the native driver
        if: inputs.hardware
        run: cargo test --locked --features gui --target ${{ matrix.target }} --test port_services_vulkan -- --ignored --test-threads=1
      - name: Verify native image and indexed Slang builds, with visible Vulkan windows on hardware
        shell: pwsh
        env:
          GAMEPKG_TEST_EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          New-Item -ItemType Directory -Force target/windows-gui-proof | Out-Null
          $options = @()
          if ('${{ inputs.hardware }}' -eq 'true') { $options += '--visible' }
          python tests/windows_native_gui.py --shader-backend ${{ matrix.shader-backend }} @options 2>&1 | Tee-Object -FilePath target/windows-gui-proof/native-graphics.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content -Raw target/windows-gui-proof/native-graphics.log
          if ($log -notmatch 'Verified signed offline Windows native image build and online-package denial:') { throw 'Missing signed image-build proof' }
          if ($log -notmatch 'Verified signed offline Windows native indexed Slang build') { throw 'Missing signed Slang build and receipt proof' }
          if ('${{ inputs.hardware }}' -eq 'true') {
            foreach ($launch in @('first', 'restart')) {
              if ($log -notmatch "Verified visible Windows native Vulkan image window: $launch") { throw "Missing Vulkan window proof: $launch" }
            }
            if ($log -notmatch 'Verified visible Windows native Vulkan indexed Slang window') { throw 'Missing visible Slang pipeline proof' }
          }
      - name: Package matching apps after the available native graphics checks
        shell: pwsh
        env:
          GAMEPKG_PREVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tests/package_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_release.py target/windows-app-preview --binary-directory target/release --target ${{ matrix.target }} --native-sdk $env:GAMEPKG_NATIVE_SDK_ARCHIVE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $preview = @{
            schema = 1
            kind = 'unreleased app preview'
            source_head = $env:GAMEPKG_PREVIEW_HEAD
            checkout_commit = (git rev-parse HEAD)
            architecture = '${{ matrix.architecture }}'
            target = '${{ matrix.target }}'
            workflow_run = '${{ github.run_id }}'
            required_checks = @('signed native image build', 'signed indexed Slang build and receipt', 'offline admission', 'sparse storage allocation')
          }
          if ('${{ inputs.hardware }}' -eq 'true') { $preview.required_checks += 'visible hardware Vulkan image and indexed Slang windows' }
          $preview | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 target/windows-app-preview/PREVIEW.json
      - name: Preserve matching app packages for runtime integration
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-app-preview-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.architecture }}
          path: target/windows-app-preview
          retention-days: 7
          if-no-files-found: error
      - name: Preserve native window pixels and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-graphics-evidence-${{ matrix.architecture }}
          path: target/windows-gui-proof
          retention-days: 7
          if-no-files-found: warn
