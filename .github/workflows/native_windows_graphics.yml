name: Native Windows game graphics
on:
  push:
    paths:
      - 'src/storage.rs'
      - 'src/storage/**'
      - 'tests/storage.rs'
      - 'src/gui.rs'
      - 'src/bin/gui.rs'
      - 'src/gpu*.rs'
      - 'src/runtime.rs'
      - 'src/native/**'
      - 'src/shaders.rs'
      - 'src/windows_compiler.rs'
      - 'src/takedawn_windows_sdk.rs'
      - 'engines/native/**'
      - 'engines/takedawn/windows-runner/**'
      - 'tests/windows_native_gui.py'
      - 'tests/windows_owned_window.py'
      - 'tests/windows_doom_gui.py'
      - 'tests/doom_gui_proof.py'
      - 'tests/doom_gui_proof_test.py'
      - 'tests/windows_gui_support.py'
      - 'tests/windows_graphics_capture.py'
      - 'tests/reference/windows-native-graphics/**'
      - 'tools/build_release.rs'
      - 'tools/install_mesa_test.py'
      - 'tools/build_vulkan_test.py'
      - 'tools/windows_vulkan_test_probe.c'
      - 'tools/package_release.py'
      - 'tools/windows_pe_imports.py'
      - 'tests/package_architecture.py'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/native_windows_graphics.yml'
  pull_request:
    paths:
      - 'src/storage.rs'
      - 'src/storage/**'
      - 'tests/storage.rs'
      - 'src/gui.rs'
      - 'src/bin/gui.rs'
      - 'src/gpu*.rs'
      - 'src/runtime.rs'
      - 'src/native/**'
      - 'src/shaders.rs'
      - 'src/windows_compiler.rs'
      - 'src/takedawn_windows_sdk.rs'
      - 'engines/native/**'
      - 'engines/takedawn/windows-runner/**'
      - 'tests/windows_native_gui.py'
      - 'tests/windows_owned_window.py'
      - 'tests/windows_doom_gui.py'
      - 'tests/doom_gui_proof.py'
      - 'tests/doom_gui_proof_test.py'
      - 'tests/windows_gui_support.py'
      - 'tests/windows_graphics_capture.py'
      - 'tests/reference/windows-native-graphics/**'
      - 'tools/build_release.rs'
      - 'tools/install_mesa_test.py'
      - 'tools/build_vulkan_test.py'
      - 'tools/windows_vulkan_test_probe.c'
      - 'tools/package_release.py'
      - 'tools/windows_pe_imports.py'
      - 'tests/package_architecture.py'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/native_windows_graphics.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-windows-graphics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-graphics:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            mesa: x64
            architecture: x86_64
          - target: i686-pc-windows-msvc
            mesa: x86
            architecture: i686
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-windows-graphics-${{ matrix.target }}
      - name: Build the native CLI and game window with embedded audio companions
        shell: pwsh
        run: |
          rustc --edition=2021 --target ${{ matrix.target }} tools/build_release.rs -o gamepkg-build-release.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./gamepkg-build-release.exe --github-env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify sparse storage allocation at the app executable width
        shell: pwsh
        run: |
          cargo test --locked --release --target ${{ matrix.target }} --test storage -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare test-only software OpenGL and screenshot tools
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/windows_graphics_capture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/doom_gui_proof_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/install_mesa_test.py target/release --architecture ${{ matrix.mesa }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native shader textures, keyboard input, resize, restart and history
        shell: pwsh
        env:
          GAMEPKG_TEST_EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          New-Item -ItemType Directory -Force target/windows-gui-proof | Out-Null
          python tests/windows_native_gui.py 2>&1 | Tee-Object -FilePath target/windows-gui-proof/native-graphics.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content -Raw target/windows-gui-proof/native-graphics.log
          foreach ($backend in @('glsl', 'spirv', 'wgsl')) {
            if ($log -notmatch "Verified native Windows shader texture/input/clear/resize/restart/history: $backend") { throw "Missing native $backend window qualification" }
          }
      - name: Build a test-local Vulkan loader and exercise native Vulkan windows
        shell: pwsh
        env:
          GAMEPKG_TEST_EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          python tools/build_vulkan_test.py target/release --architecture ${{ matrix.mesa }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/release/vulkan-test-loader.json target/windows-gui-proof/
          $env:VK_DRIVER_FILES = (Resolve-Path "target/release/lvp_icd.${{ matrix.mesa == 'x86' && 'x86' || 'x86_64' }}.json").Path
          $env:VK_ICD_FILENAMES = $env:VK_DRIVER_FILES
          $env:VK_LOADER_DEBUG = 'all'
          ./target/release/gamepkg-vulkan-test-probe.exe 2>&1 | Tee-Object -FilePath target/windows-gui-proof/vulkan-probe.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/windows_native_gui.py --renderer vulkan 2>&1 | Tee-Object -FilePath target/windows-gui-proof/native-vulkan.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content -Raw target/windows-gui-proof/native-vulkan.log
          foreach ($backend in @('spirv', 'wgsl')) {
            if ($log -notmatch "Verified native Windows shader texture/input/clear/resize/restart/history: $backend vulkan") { throw "Missing native $backend Vulkan qualification" }
          }
      - name: Verify public DOOM through default Build and owned game windows
        shell: pwsh
        env:
          GAMEPKG_TEST_EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          python tests/windows_doom_gui.py 2>&1 | Tee-Object -FilePath target/windows-gui-proof/doom-integration.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content -Raw target/windows-gui-proof/doom-integration.log
          foreach ($renderer in @('opengl', 'vulkan')) {
            foreach ($launch in @('first', 'restart')) {
              if ($log -notmatch "Verified Windows DOOM GUI: $renderer $launch;") { throw "Missing DOOM $renderer $launch integration" }
            }
          }
      - name: Package matching apps after successful native graphics checks
        shell: pwsh
        env:
          GAMEPKG_PREVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tests/package_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_release.py target/windows-app-preview --binary-directory target/release --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $preview = @{
            schema = 1
            kind = 'unreleased app preview'
            source_head = $env:GAMEPKG_PREVIEW_HEAD
            checkout_commit = (git rev-parse HEAD)
            architecture = '${{ matrix.architecture }}'
            target = '${{ matrix.target }}'
            workflow_run = '${{ github.run_id }}'
            required_checks = @('native shader windows', 'Vulkan windows', 'DOOM first/restart windows', 'sparse storage allocation')
          }
          $preview | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 target/windows-app-preview/PREVIEW.json
      - name: Preserve matching app packages for runtime integration
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-app-preview-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.architecture }}
          path: target/windows-app-preview
          retention-days: 7
          if-no-files-found: error
      - name: Preserve native window pixels and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-graphics-evidence-${{ matrix.architecture }}
          path: target/windows-gui-proof
          retention-days: 7
          if-no-files-found: warn
