name: Original menu pixel comparison
on:
  push:
    paths:
      - 'tests/menu_controls_gui.py'
      - 'tests/reference/arkanoo_menu_controls.py'
      - 'web-player/**'
      - 'src/bin/gui.rs'
      - 'src/gui.rs'
      - 'src/gui/**'
      - 'src/drawing*'
      - 'src/web_export.rs'
      - 'ports'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/menu_pixels.yml'
  pull_request:
    paths:
      - 'tests/menu_controls_gui.py'
      - 'tests/reference/arkanoo_menu_controls.py'
      - 'web-player/**'
      - 'src/bin/gui.rs'
      - 'src/gui.rs'
      - 'src/gui/**'
      - 'src/drawing*'
      - 'src/web_export.rs'
      - 'ports'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/menu_pixels.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-menu-pixels-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-menu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: original-menu-pixels
      - name: Install private-display and original SDL reference prerequisites
        run: |
          bash tools/ci_ubuntu_apt.sh update
          bash tools/ci_ubuntu_apt.sh install -y --no-install-recommends bubblewrap xvfb xdotool imagemagick python3-pil python3-selenium libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libasound2-dev libudev-dev pkg-config libxkbcommon-x11-0 libgl1 libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers
          test -x "$CHROMEWEBDRIVER/chromedriver"
          sudo ln -sf "$CHROMEWEBDRIVER/chromedriver" /usr/local/bin/chromedriver
          google-chrome --version
          chromedriver --version
          gamepkg_software_icd=
          for gamepkg_icd_path in /usr/share/vulkan/icd.d/lvp_icd*.json; do
            if test -f "$gamepkg_icd_path"; then gamepkg_software_icd="$gamepkg_icd_path"; break; fi
          done
          test -n "$gamepkg_software_icd"
          echo "VK_ICD_FILENAMES=$gamepkg_software_icd" >> "$GITHUB_ENV"
      - name: Build the actual desktop and CLI entries
        run: cargo build --locked --release --features gui --bins
      - name: Install the pinned shader compiler and stage the isolated Rust compiler
        run: |
          python3 tools/install_slang.py /tmp/gamepkg-menu-slang
          sudo cp -a "$(rustc --print sysroot)" /tmp/gamepkg-menu-toolchain
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-menu-rustup rustup toolchain link gamepkg-menu /tmp/gamepkg-menu-toolchain
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-menu-rustup rustup default gamepkg-menu
          printf 'pcm.!default { type null }\n' > /tmp/gamepkg-menu-null-alsa.conf
      - uses: actions/checkout@v4
        with:
          repository: c0m4r/arkanoo
          ref: 9d613e78c9ed5657ae7fda9206cd4a82a893b7c8
          path: target/reference-arkanoo
          persist-credentials: false
      - name: Compare original menu pixels without changing the two-level limit
        run: sudo env PATH="$PATH" VK_ICD_FILENAMES="$VK_ICD_FILENAMES" RUSTUP_HOME=/tmp/gamepkg-menu-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT=/tmp/gamepkg-menu-slang CHROMEWEBDRIVER="$CHROMEWEBDRIVER" ALSA_CONFIG_PATH=/tmp/gamepkg-menu-null-alsa.conf SDL_AUDIODRIVER=dummy /usr/bin/python3 tests/menu_controls_gui.py --original target/reference-arkanoo
      - name: Compare scaled controls directly against original SDL
        run: sudo env PATH="$PATH" VK_ICD_FILENAMES="$VK_ICD_FILENAMES" RUSTUP_HOME=/tmp/gamepkg-menu-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT=/tmp/gamepkg-menu-slang CHROMEWEBDRIVER="$CHROMEWEBDRIVER" ALSA_CONFIG_PATH=/tmp/gamepkg-menu-null-alsa.conf SDL_AUDIODRIVER=dummy /usr/bin/python3 tests/menu_controls_gui.py --original target/reference-arkanoo --flat-background --proof-output target/menu-controls-flat-proof
      - name: Preserve native, browser, reference and difference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-menu-pixel-evidence
          path: |
            target/menu-controls-proof
            target/menu-controls-flat-proof
          retention-days: 7
          if-no-files-found: warn
