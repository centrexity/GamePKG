name: Shared native input
on:
  push:
    paths: ['engines/native-input/**', 'engines/takedawn/media-bridge/**', 'tools/prepare_takedawn_source_kit.py', 'include/gamepkg_input*.h', 'tools/check_native_input.py', 'tools/check_native_sdl2.py', 'tools/fixtures/native-sdl2/**', '.github/workflows/native_input.yml']
  pull_request:
    paths: ['engines/native-input/**', 'engines/takedawn/media-bridge/**', 'tools/prepare_takedawn_source_kit.py', 'include/gamepkg_input*.h', 'tools/check_native_input.py', 'tools/check_native_sdl2.py', 'tools/fixtures/native-sdl2/**', '.github/workflows/native_input.yml']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, arch: x64}
          - {os: ubuntu-24.04, target: i686-unknown-linux-gnu, arch: x86}
          - {os: windows-2022, target: x86_64-pc-windows-msvc, arch: x64}
          - {os: windows-2022, target: i686-pc-windows-msvc, arch: x86}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Install native Linux 32-bit linker
        if: runner.os == 'Linux' && matrix.arch == 'x86'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Check source
        run: |
          cargo fmt --manifest-path engines/native-input/Cargo.toml -- --check
          cargo clippy --locked --manifest-path engines/native-input/Cargo.toml --all-targets -- -D warnings
      - name: Run native state, concurrency and actual C ABI checks
        run: python tools/check_native_input.py --target ${{ matrix.target }} --output native-input-results
      - name: Verify pinned controller staging and source protection
        if: runner.os == 'Linux' && matrix.arch == 'x64'
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/xenophobentx/xboxrecomp/5ae8ad90d984425e834dee759592c15592679880/src/input/xinput_device.c --output native-input-results/pinned-xinput.c
          curl --fail --location --retry 3 https://raw.githubusercontent.com/xenophobentx/xboxrecomp/5ae8ad90d984425e834dee759592c15592679880/src/input/input_core.c --output native-input-results/pinned-core.c
          python tools/check_native_input.py --target ${{ matrix.target }} --output native-input-results --pinned-xinput native-input-results/pinned-xinput.c --pinned-input-core native-input-results/pinned-core.c
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-input-${{ matrix.target }}
          path: |
            native-input-results/*.log
            native-input-results/result.json
  android-layout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,i686-linux-android
      - name: Compile the 32-bit Android library and ABI assertions
        run: |
          cargo build --locked --release --manifest-path engines/native-input/Cargo.toml --target armv7-linux-androideabi
          cargo build --locked --release --manifest-path engines/native-input/Cargo.toml --target i686-linux-android

  sdl2:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-gnu, arch: x86_64-linux-gnu, cflags: ''}
          - {target: i686-unknown-linux-gnu, arch: i386-linux-gnu, cflags: '-m32'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xenophobentx/xboxrecomp
          ref: 5ae8ad90d984425e834dee759592c15592679880
          path: pinned-sdk
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install SDL2 for both native widths
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libsdl2-dev libsdl2-dev:i386 ninja-build
      - name: Build the real Rust service
        run: cargo build --locked --release --manifest-path engines/native-input/Cargo.toml --target ${{ matrix.target }}
      - name: Run actual SDL2 engine integration and original input regressions
        run: >-
          python3 tools/check_native_sdl2.py --toolkit pinned-sdk
          --library engines/native-input/target/${{ matrix.target }}/release/libgamepkg_native_input.a
          --output native-sdl2-results --cflags='${{ matrix.cflags }}'
          --sdl2-library /usr/lib/${{ matrix.arch }}/libSDL2.so
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sdl2-${{ matrix.target }}
          path: |
            native-sdl2-results/*.log
            native-sdl2-results/result.json
