        run: |
          cargo fetch --locked
          # Standalone Rust integration probes can leave a headless CLI in
          # target/release. Package a matching desktop pair, not that probe.
          cargo build --locked --release --all-features --bins
          python3 tools/package_release.py "$RUNNER_TEMP/gamepkg-distribution"
          gamepkg_release_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
