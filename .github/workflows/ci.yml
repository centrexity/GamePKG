name: Rust checks
on:
  push:
    paths-ignore: ['README.md', 'DESIGN.md', 'docs/**', 'html/**', '.github/workflows/pages.yml', 'tools/check_site.py']
  pull_request:
    paths-ignore: ['README.md', 'DESIGN.md', 'docs/**', 'html/**', '.github/workflows/pages.yml', 'tools/check_site.py']
permissions:
  contents: read
concurrency:
  group: gamepkg-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        features: ["", "--all-features"]
    steps:
      - uses: actions/checkout@v4
      - name: Install preview codecs
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Rust tools
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Install audio development headers
        if: matrix.features == '--all-features'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked ${{ matrix.features }}
      - name: Lint
        run: cargo clippy --locked --all-targets ${{ matrix.features }} -- -D warnings
      - name: Build CLI and GUI
        if: matrix.features == '--all-features'
        run: cargo build --locked --release --all-features --bins
      - name: Local HTTPS integration
        if: matrix.features == '--all-features'
        run: python3 tests/https_download.py
      - name: GitHub project download and signed update integration
        if: matrix.features == '--all-features'
        run: python3 tests/github_download.py
      - name: Tor routing integration
        if: matrix.features == '--all-features'
        run: python3 tests/tor_download.py
      - name: Install isolated build prerequisites
        if: matrix.features == '--all-features'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap && rustup target add wasm32-unknown-unknown
      - name: Install pinned shader compiler
        if: matrix.features == '--all-features'
        run: |
          python3 tools/install_slang.py "/tmp/gamepkg-slang"
          echo "GAMEPKG_SLANG_ROOT=/tmp/gamepkg-slang" >> "$GITHUB_ENV"
      - name: Install pinned DXC for DXIL shaders
        if: matrix.features == '--all-features'
        run: |
          python3 tools/install_dxc.py "/tmp/gamepkg-dxc"
          echo "GAMEPKG_DXC_ROOT=/tmp/gamepkg-dxc" >> "$GITHUB_ENV"
      - name: Stage compiler for privileged namespace tests
        if: matrix.features == '--all-features'
        run: |
          sudo cp -a "$(rustc --print sysroot)" /tmp/gamepkg-ci-toolchain
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup rustup toolchain link gamepkg-ci /tmp/gamepkg-ci-toolchain
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup rustup default gamepkg-ci
      # Hosted runners restrict unprivileged network namespace setup. These
      # controlled fixture tests run as root while bwrap still isolates the build.
      - name: Isolated compiler integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/isolated_build.py
      - name: Compile every good example and reject every bad example
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/good_examples.py
      - name: Playable source build integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/playable.py
      - name: Signed play history and achievement integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/progress_game.py
      - name: Multiple ROMs and integrity repair
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/integrity_roms.py
      - name: Restore shared assets from verified store bundles
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/integrity_store.py
      - name: Reject special and oversized files without blocking
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/special_files.py
      - name: Signed WIT component integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/components_game.py
      - name: Compiler output limits and cache preservation
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/compiler_limits.py
      - name: Signed preview validation and decoding
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" python3 tests/previews.py
      - name: Creator directory build and atomic source package publication
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/creator_build.py
      - name: Playable entrypoint and failed-build cache preservation
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/build_entrypoints.py
      - name: Pinned approved guest dependency
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/approved_crate_game.py
      - name: Shared assets and HTTPS store transfer
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/shared_assets_game.py
      - name: Guest asset integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/runtime_assets.py
      - name: User ROM integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/runtime_rom.py
      - name: Scoped save integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/runtime_saves.py
      - name: Pinned shader integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" GAMEPKG_DXC_ROOT="$GAMEPKG_DXC_ROOT" python3 tests/shaders.py
      - name: Guest drawing integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/drawing_game.py
      - name: Install virtual display tools
        if: matrix.features == '--all-features'
        run: sudo apt-get install -y xvfb xdotool imagemagick tesseract-ocr python3-pil libxkbcommon-x11-0 libgl1-mesa-dri
      - name: Verify GitHub project downloads in the desktop library
        if: matrix.features == '--all-features'
        run: python3 tests/github_download.py --gui
      - name: Verify library rejection notices and unreadable-folder recovery
        if: matrix.features == '--all-features'
        run: python3 tests/library_gui.py
      - name: Verify library Build, Play, return, and Rebuild buttons
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/library_play_gui.py
      - name: Unlock achievements through normal desktop gameplay
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/progress_gui.py
      - name: Restore shared assets through the desktop library
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/integrity_store.py --gui
      - name: Named multiple ROM desktop playback
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/roms_gui.py
      - name: Verify desktop Settings approval persistence and cancellation
        if: matrix.features == '--all-features'
        run: python3 tests/settings_gui.py
      - name: Verify desktop store import review and approval
        if: matrix.features == '--all-features'
        run: python3 tests/store_gui.py
      - name: Verify video previews and Theora fallback in the GUI
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" /usr/bin/python3 tests/previews_gui.py
      - name: Verify periodic signed update checks in the GUI
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" /usr/bin/python3 tests/updates_gui.py
      - name: Verify RGBA sprite pixels and transparency in both runtimes
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/sprites_gui.py
      - name: Verify packaged and shared PNG sprite rendering
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/sprites_gui.py --png
      - name: Verify guest drawing in the GUI
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/drawing_gui.py
      - name: Verify WIT component gameplay in the GUI
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/component_gui.py
      - name: Verify WGSL shader rendering in both runtimes
        if: matrix.features == '--all-features'
        run: |
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --backend wgsl
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --backend wgsl --component
      - name: Verify SPIR-V shader rendering in both runtimes
        if: matrix.features == '--all-features'
        run: |
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --backend spirv
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --backend spirv --component
      - name: Verify compiled package shaders in the GUI
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --without-compiler
      - name: Verify WIT component shader passes
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --component

      - name: Verify bounded shader textures in both runtimes
        if: matrix.features == '--all-features'
        run: |
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --texture
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --texture --component

      - name: Verify translated shader textures in both runtimes
        if: matrix.features == '--all-features'
        run: |
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --texture --backend wgsl
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --texture --backend wgsl --component
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --texture --backend spirv
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --texture --backend spirv --component

      - name: Null audio output integration
        if: matrix.features == '--all-features'
        run: |
          echo 'pcm.!default { type null }' > "$RUNNER_TEMP/gamepkg-null-alsa.conf"
          ALSA_CONFIG_PATH="$RUNNER_TEMP/gamepkg-null-alsa.conf" cargo test --locked --all-features audio_output_null_device -- --ignored --test-threads=1
      - name: Signed guest audio integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/audio_game.py
      - name: Verify GUI audio and mute on a null device
        if: matrix.features == '--all-features'
        run: |
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/audio_gui.py
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/audio_gui.py --muted
      - name: Package and verify extracted Linux distribution
        if: matrix.features == '--all-features'
        run: |
          cargo fetch --locked
          python3 tools/package_release.py "$RUNNER_TEMP/gamepkg-distribution"
          gamepkg_release_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/release_package.py "$RUNNER_TEMP/gamepkg-distribution/gamepkg-${gamepkg_release_version}-linux-x86_64.tar.gz"
      - name: Preserve desktop screenshots after a failed integration
        uses: actions/upload-artifact@v4
        if: failure() && matrix.features == '--all-features'
        with:
          name: gamepkg-desktop-failure-screenshots
          path: target/*.png
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: matrix.features == '--all-features'
        with:
          name: verified-gamepkg-linux-x86_64
          path: ${{ runner.temp }}/gamepkg-distribution/*
          retention-days: 7
          if-no-files-found: error
