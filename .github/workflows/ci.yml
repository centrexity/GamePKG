          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --backend spirv --component
      - name: Verify compiled package shaders in the GUI
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --without-compiler
      - name: Verify WIT component shader passes
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --component

      - name: Verify bounded shader textures in both runtimes
        if: matrix.features == '--all-features'
        run: |
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --texture
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --texture --component

      - name: Verify translated shader textures in both runtimes
        if: matrix.features == '--all-features'
        run: |
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --texture --backend wgsl
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --texture --backend wgsl --component
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --texture --backend spirv
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --texture --backend spirv --component

      - name: Verify native shader textures and transparent fallback
        if: matrix.features == '--all-features'
        run: |
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --texture --native --backend glsl
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --texture --native --backend spirv
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --texture --native --backend wgsl

      - name: Null audio output integration
        if: matrix.features == '--all-features'
        run: |
          echo 'pcm.!default { type null }' > "$RUNNER_TEMP/gamepkg-null-alsa.conf"
          ALSA_CONFIG_PATH="$RUNNER_TEMP/gamepkg-null-alsa.conf" cargo test --locked --all-features audio_output_null_device -- --ignored --test-threads=1
      - name: Signed guest audio integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/audio_game.py
      - name: Verify GUI audio and mute on a null device
        if: matrix.features == '--all-features'
        run: |
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/audio_gui.py
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/audio_gui.py --muted
      - name: Package and verify extracted Linux distribution
        if: matrix.features == '--all-features'
        run: |
          cargo fetch --locked
          python3 tools/package_release.py "$RUNNER_TEMP/gamepkg-distribution"
          gamepkg_release_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/release_package.py "$RUNNER_TEMP/gamepkg-distribution/gamepkg-${gamepkg_release_version}-linux-x86_64.tar.gz"
      - name: Preserve desktop screenshots after a failed integration
        uses: actions/upload-artifact@v4
        if: failure() && matrix.features == '--all-features'
        with:
          name: gamepkg-desktop-failure-screenshots
          path: target/*.png
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: matrix.features == '--all-features'
        with:
          name: verified-gamepkg-linux-x86_64
          path: ${{ runner.temp }}/gamepkg-distribution/*
          retention-days: 7
          if-no-files-found: error
  zip32:
    name: Archive and sprite helpers on actual Linux 32-bit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install multilib compiler and runtime
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++
      - name: Execute checked Xbox RAM and blocking critical sections as ELF32
        run: |
          cc -m32 -std=c11 -O3 -Wall -Wextra -Werror -pthread -fsanitize=undefined -fsanitize-undefined-trap-on-error -I engines/takedawn/native-gen/runtime engines/takedawn/native-gen/tests/memory_runtime.c engines/takedawn/native-gen/runtime/gamepkg_x86_memory.c engines/takedawn/native-gen/runtime/gamepkg_x86_fault.c -o /tmp/gamepkg-memory32
          /tmp/gamepkg-memory32
      - name: Execute current ZIP boundary assertions as ELF32
        run: python3 tools/check_cube2_zip32.py
      - name: Execute original PPU sprite and color checks as ELF32
        run: python3 tools/check_zelda_sprite_limits.py --32-bit
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: i686-unknown-linux-gnu
      - name: Execute reviewed native SSE control on Linux 64-bit and 32-bit
        run: |
          python3 tools/check_takedawn_native_mxcsr.py
          python3 tools/check_takedawn_native_mxcsr.py --target i686-unknown-linux-gnu
      - name: Execute production controller look timing as ELF32
        run: python3 tools/check_controller_look.py --32-bit
      - name: Execute production touch camera with real egui as ELF32
        run: |
          cargo fetch --locked
          python3 tools/check_touch_look.py --32-bit
          python3 tools/check_touch_look.py --32-bit --cancellation
      - name: Verify bounded and original replay readers as ELF32
        run: python3 tools/check_zelda_replay.py --32-bit
      - name: Execute original Zelda enhancement and HUD references as ELF32
        run: |
          python3 tools/check_zelda_video_reference.py --32-bit
          python3 tools/check_zelda_low_health_reference.py --32-bit
          python3 tools/check_zelda_inventory_reference.py --32-bit
          python3 tools/check_zelda_bird_reference.py --32-bit
          python3 tools/check_zelda_bird_arrival.py --32-bit
          python3 tools/check_zelda_frame_schedule.py --32-bit
          python3 tools/check_zelda_audio_state.py --32-bit
      - name: Execute scoped save failure and recovery as ELF32
        run: |
          python3 tools/check_arkanoo_save32.py
          cc -m32 -isystem /usr/include/x86_64-linux-gnu -DGAMEPKG_TEST_32 -O1 -Wall -Wextra -Werror -fsanitize=undefined -fsanitize-undefined-trap-on-error tests/doom_storage.c -o /tmp/doom-storage32
          /tmp/doom-storage32
      - name: Execute music completion and loops as ELF32
        run: python3 tools/check_doom_music.py --32-bit
      - name: Execute linked sound-name table as ELF32
        run: |
          cc -m32 -DGAMEPKG_TEST_32 -Wall -Wextra -Werror -fsanitize=undefined -fsanitize-undefined-trap-on-error tests/doom_sound_names.c -o /tmp/doom-names32
          /tmp/doom-names32
      - name: Execute DMX sound framing and stereo mixer as ELF32
        run: |
          cc -m32 -DGAMEPKG_TEST_32 -Wall -Wextra -Werror -fsanitize=undefined -fsanitize-undefined-trap-on-error tests/doom_audio.c -o /tmp/doom-audio32
          /tmp/doom-audio32
      - name: Execute original sound allocation and priority as ELF32
        run: |
          cc -m32 -DGAMEPKG_TEST_32 -O1 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Wl,--gc-sections -fsanitize=undefined -fsanitize-undefined-trap-on-error tests/doom_sound_channels.c -o /tmp/doom-channels32
          /tmp/doom-channels32
      - name: Execute original sound-ID boundaries as ELF32
        run: python3 tools/check_doom_sound_ids.py --32-bit
      - name: Execute original supported and disabled music devices as ELF32
        run: python3 tools/check_doom_music_devices.py --32-bit
      - name: Execute portable Zelda DMA save-state component as ELF32
        run: python3 tools/check_zelda_dma_state.py --32-bit
      - name: Execute portable Zelda DSP save-state component as ELF32
        run: python3 tools/check_zelda_dma_state.py --component dsp --32-bit
      - name: Execute portable Zelda PPU save-state component as ELF32
        run: python3 tools/check_zelda_dma_state.py --component ppu --32-bit
      - name: Execute bounded whole Zelda snapshot callbacks as ELF32
        run: |
          python3 tools/check_zelda_snapshot.py --32-bit
          python3 tools/check_zelda_spc_state.py --32-bit
          python3 tools/check_zelda_spc_state.py --playback --32-bit
      - name: Execute original sound distance and attenuation as ELF32
        run: python3 tools/check_doom_sound_ids.py --fixture spatial --32-bit
      - name: Execute original point-to-angle arithmetic as ELF32
        run: python3 tools/check_doom_angles.py --32-bit
      - name: Execute original spatial sound with actual angle backend as ELF32
        run: python3 tools/check_doom_sound_ids.py --fixture spatial --real-angles --32-bit
      - name: Execute original DOOM fixed-point checks as ELF32
        run: python3 tools/check_doom_fixed_math.py --32-bit
      - name: Execute original DOOM sprite-coordinate checks as ELF32
        run: python3 tools/check_doom_sprite_coordinates.py --32-bit
      - name: Execute original DOOM map-coordinate checks as ELF32
        run: python3 tools/check_doom_map_coordinates.py --32-bit
      - name: Execute signed DOOM data conversions as ELF32
        run: python3 tools/check_doom_endian_words.py --32-bit
      - name: Execute native pixel conversion tests as ELF32
        run: python3 tools/check_native_pixels32.py
