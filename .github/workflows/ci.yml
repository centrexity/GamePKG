      - name: Verify Arkanoo isolated build, gameplay, audio, saves and native controls
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/arkanoo.py --skip-browser
      - name: Verify original Arkanoo resolution controls, confirmation and timeout
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/arkanoo_resolution_gui.py
