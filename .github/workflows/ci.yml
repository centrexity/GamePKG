name: Rust checks
on:
  push:
    paths-ignore: ['README.md', 'DESIGN.md', 'docs/**', 'html/**', '.github/workflows/pages.yml', 'tools/check_site.py']
  pull_request:
    paths-ignore: ['README.md', 'DESIGN.md', 'docs/**', 'html/**', '.github/workflows/pages.yml', 'tools/check_site.py']
permissions:
  contents: read
concurrency:
  group: gamepkg-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features: ["", "--all-features"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install preview codecs
        run: sudo apt-get update && sudo apt-get install -y ffmpeg g++ libsdl2-dev openssl
      - name: Install Rust tools
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Install audio development headers
        if: matrix.features == '--all-features'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libsdl2-mixer-dev libmpg123-dev libmpfr-dev
      - name: Verify original SDL music repeat count and callback continuity
        if: matrix.features == '--all-features'
        run: |
          mkdir -p target
          cc -Wall -Wextra -Werror tests/music_loops.c -o target/music-loops-reference $(pkg-config --cflags --libs SDL2_mixer sdl2)
          target/music-loops-reference
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify bit-exact optimized audio against the preserved baseline
        run: |
          mkdir -p target
          sha256sum -c tools/audio-resample-bench/source-lock.sha256
          rustc --edition=2021 -Dwarnings -C opt-level=3 tools/audio-resample-bench/main.rs -o target/audio-resample-compare
          target/audio-resample-compare --verify-only
          rustup target add wasm32-unknown-unknown
          rustc --edition=2021 -Dwarnings --target wasm32-unknown-unknown --crate-type cdylib -C opt-level=3 -C panic=abort -C link-arg=-zstack-size=1048576 -C link-arg=--max-memory=16777216 tools/audio-resample-bench/wasm.rs -o target/audio-resample-compare.wasm
          node tools/audio-resample-bench/check-wasm.cjs target/audio-resample-compare.wasm
      - name: Verify native Xbox generator synthetic semantics without game media
        if: matrix.features == '--all-features'
        run: |
          cargo fmt --manifest-path engines/takedawn/native-gen/Cargo.toml -- --check
          GAMEPKG_TAKEDAWN_PREDICATE_CORPUS="$RUNNER_TEMP/gamepkg-predicate-corpus.bin" GAMEPKG_TAKEDAWN_SELECTION_CORPUS="$RUNNER_TEMP/gamepkg-selection-corpus.bin" GAMEPKG_TAKEDAWN_X87_TRIG_PUSH_CORPUS="$RUNNER_TEMP/gamepkg-x87-trig-push-corpus.bin" GAMEPKG_TAKEDAWN_X87_SINCOS_CORPUS="$RUNNER_TEMP/gamepkg-x87-sincos-corpus.bin" GAMEPKG_TAKEDAWN_X87_FPATAN_CORPUS="$RUNNER_TEMP/gamepkg-x87-fpatan-corpus.bin" GAMEPKG_TAKEDAWN_X87_FYL2XP1_CORPUS="$RUNNER_TEMP/gamepkg-x87-fyl2xp1-corpus.bin" GAMEPKG_TAKEDAWN_X87_FYL2X_CORPUS="$RUNNER_TEMP/gamepkg-x87-fyl2x-corpus.bin" GAMEPKG_TAKEDAWN_X87_F2XM1_CORPUS="$RUNNER_TEMP/gamepkg-x87-f2xm1-corpus.bin" GAMEPKG_TAKEDAWN_F128_CORPUS="$RUNNER_TEMP/gamepkg-f128-corpus.bin" GAMEPKG_TAKEDAWN_F128_FIXTURE="$RUNNER_TEMP/gamepkg-f128-fixture.c" GAMEPKG_TAKEDAWN_ARITHMETIC_CORPUS="$RUNNER_TEMP/gamepkg-arithmetic-corpus.bin" GAMEPKG_TAKEDAWN_EXT80_CORPUS="$RUNNER_TEMP/gamepkg-ext80-corpus.bin" GAMEPKG_TAKEDAWN_MMX_SHIFT_CORPUS="$RUNNER_TEMP/gamepkg-mmx-shift-corpus.bin" GAMEPKG_TAKEDAWN_MMX_LANES_CORPUS="$RUNNER_TEMP/gamepkg-mmx-lanes-corpus.bin" GAMEPKG_TAKEDAWN_MMX_CONVERSION_CORPUS="$RUNNER_TEMP/gamepkg-mmx-conversion-corpus.bin" GAMEPKG_TAKEDAWN_X87_MEMORY_CORPUS="$RUNNER_TEMP/gamepkg-x87-memory-corpus.bin" GAMEPKG_TAKEDAWN_X87_MEMORY_FIXTURE="$RUNNER_TEMP/gamepkg-x87-memory-fixture.c" GAMEPKG_TAKEDAWN_X87_COMPARE_CORPUS="$RUNNER_TEMP/gamepkg-x87-compare-corpus.bin" GAMEPKG_TAKEDAWN_X87_COMPARE_FIXTURE="$RUNNER_TEMP/gamepkg-x87-compare-fixture.c" GAMEPKG_TAKEDAWN_X87_STORE_CORPUS="$RUNNER_TEMP/gamepkg-x87-store-corpus.bin" GAMEPKG_TAKEDAWN_X87_STORE_FIXTURE="$RUNNER_TEMP/gamepkg-x87-store-fixture.c" GAMEPKG_TAKEDAWN_X87_ENVIRONMENT_CORPUS="$RUNNER_TEMP/gamepkg-x87-environment-corpus.bin" GAMEPKG_TAKEDAWN_X87_ENVIRONMENT_FIXTURE="$RUNNER_TEMP/gamepkg-x87-environment-fixture.c" GAMEPKG_TAKEDAWN_X87_REMAINDER_CORPUS="$RUNNER_TEMP/gamepkg-x87-remainder-corpus.bin" GAMEPKG_TAKEDAWN_X87_REMAINDER_FIXTURE="$RUNNER_TEMP/gamepkg-x87-remainder-fixture.c" GAMEPKG_TAKEDAWN_X87_SCALE_CORPUS="$RUNNER_TEMP/gamepkg-x87-scale-corpus.bin" GAMEPKG_TAKEDAWN_X87_SCALE_FIXTURE="$RUNNER_TEMP/gamepkg-x87-scale-fixture.c" GAMEPKG_TAKEDAWN_X87_STACK_CORPUS="$RUNNER_TEMP/gamepkg-x87-stack-corpus.bin" GAMEPKG_TAKEDAWN_X87_STACK_FIXTURE="$RUNNER_TEMP/gamepkg-x87-stack-fixture.c" cargo test --locked --release --manifest-path engines/takedawn/native-gen/Cargo.toml
          cargo clippy --locked --release --all-targets --manifest-path engines/takedawn/native-gen/Cargo.toml -- -D warnings
      - name: Verify software SSE, extended math and MMX lanes on a 32-bit big-endian CPU
        if: matrix.features == '--all-features'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update && sudo apt-get install -y qemu-user qemu-system-x86 gcc-mips-linux-gnu libc6-dev-mips-cross
          # The same gate runs native gcc -m32 fixtures as well as MIPS.
          # Install its headers/runtime without the gcc-multilib meta-package,
          # which conflicts with cross-compiler meta-packages on this image.
          sudo apt-get install -y --no-install-recommends libc6-dev-i386 lib32gcc-13-dev linux-libc-dev:i386
          GAMEPKG_ARITHMETIC_CORPUS_SOURCE="$RUNNER_TEMP/gamepkg-arithmetic-corpus.bin" bash tools/check_takedawn_arithmetic_portability.sh
          GAMEPKG_EXT80_CORPUS_SOURCE="$RUNNER_TEMP/gamepkg-ext80-corpus.bin" bash tools/check_takedawn_ext80_portability.sh
          GAMEPKG_MMX_SHIFT_CORPUS_SOURCE="$RUNNER_TEMP/gamepkg-mmx-shift-corpus.bin" bash tools/check_takedawn_mmx_shift_portability.sh
          GAMEPKG_MMX_LANES_CORPUS_SOURCE="$RUNNER_TEMP/gamepkg-mmx-lanes-corpus.bin" bash tools/check_takedawn_mmx_lanes_portability.sh
          GAMEPKG_MMX_CONVERSION_CORPUS_SOURCE="$RUNNER_TEMP/gamepkg-mmx-conversion-corpus.bin" bash tools/check_takedawn_mmx_conversion_portability.sh
          GAMEPKG_X87_MEMORY_CORPUS_SOURCE="$RUNNER_TEMP/gamepkg-x87-memory-corpus.bin" bash tools/check_takedawn_x87_memory_portability.sh
          GAMEPKG_X87_COMPARE_CORPUS_SOURCE="$RUNNER_TEMP/gamepkg-x87-compare-corpus.bin" bash tools/check_takedawn_x87_compare_portability.sh
          GAMEPKG_X87_STORE_CORPUS_SOURCE="$RUNNER_TEMP/gamepkg-x87-store-corpus.bin" bash tools/check_takedawn_x87_store_portability.sh
          GAMEPKG_X87_ENVIRONMENT_CORPUS_SOURCE="$RUNNER_TEMP/gamepkg-x87-environment-corpus.bin" bash tools/check_takedawn_x87_environment_portability.sh
          GAMEPKG_X87_TRIG_PUSH_CORPUS_SOURCE="$RUNNER_TEMP/gamepkg-x87-trig-push-corpus.bin" bash tools/check_takedawn_x87_trig_push_portability.sh
          GAMEPKG_X87_SINCOS_CORPUS_SOURCE="$RUNNER_TEMP/gamepkg-x87-sincos-corpus.bin" bash tools/check_takedawn_x87_sincos_portability.sh
          GAMEPKG_X87_FPATAN_CORPUS_SOURCE="$RUNNER_TEMP/gamepkg-x87-fpatan-corpus.bin" bash tools/check_takedawn_x87_fpatan_portability.sh
          GAMEPKG_X87_FYL2XP1_CORPUS_SOURCE="$RUNNER_TEMP/gamepkg-x87-fyl2xp1-corpus.bin" bash tools/check_takedawn_x87_fyl2xp1_portability.sh
          GAMEPKG_X87_FYL2X_CORPUS_SOURCE="$RUNNER_TEMP/gamepkg-x87-fyl2x-corpus.bin" bash tools/check_takedawn_x87_fyl2x_portability.sh
          GAMEPKG_X87_F2XM1_CORPUS_SOURCE="$RUNNER_TEMP/gamepkg-x87-f2xm1-corpus.bin" bash tools/check_takedawn_x87_f2xm1_portability.sh
          GAMEPKG_F128_CORPUS_SOURCE="$RUNNER_TEMP/gamepkg-f128-corpus.bin" bash tools/check_takedawn_f128_portability.sh
          GAMEPKG_X87_REMAINDER_CORPUS_SOURCE="$RUNNER_TEMP/gamepkg-x87-remainder-corpus.bin" bash tools/check_takedawn_x87_remainder_portability.sh
          GAMEPKG_X87_SCALE_CORPUS_SOURCE="$RUNNER_TEMP/gamepkg-x87-scale-corpus.bin" bash tools/check_takedawn_x87_scale_portability.sh
          GAMEPKG_X87_STACK_CORPUS_SOURCE="$RUNNER_TEMP/gamepkg-x87-stack-corpus.bin" bash tools/check_takedawn_x87_stack_portability.sh
          bash tools/check_takedawn_memory_portability.sh
          GAMEPKG_FP_CONTEXT_PORTABLE_ONLY=1 bash tools/check_takedawn_fp_context.sh
          GAMEPKG_STACK_FAULT_PORTABLE_ONLY=1 bash tools/check_takedawn_stack_fault.sh
          GAMEPKG_FLAGS_PORTABLE_ONLY=1 bash tools/check_takedawn_flags.sh
          GAMEPKG_STRINGS_PORTABLE_ONLY=1 bash tools/check_takedawn_strings.sh
          GAMEPKG_STRING_CHECKPOINTS_PORTABLE_ONLY=1 bash tools/check_takedawn_string_checkpoints.sh
          GAMEPKG_ATOMICS_PORTABLE_ONLY=1 bash tools/check_takedawn_atomics.sh
          GAMEPKG_APPROX_PORTABLE_ONLY=1 bash tools/check_takedawn_approx.sh
          GAMEPKG_DISPATCH_PORTABLE_ONLY=1 bash tools/check_takedawn_dispatch.sh
          GAMEPKG_INTERRUPTS_PORTABLE_ONLY=1 bash tools/check_takedawn_interrupts.sh
          GAMEPKG_IRQ_FLAGS_PORTABLE_ONLY=1 bash tools/check_takedawn_irq_flags.sh
          GAMEPKG_HARDWARE_INFO_PORTABLE_ONLY=1 bash tools/check_takedawn_hardware_info.sh
          GAMEPKG_BCD_PORTABLE_ONLY=1 bash tools/check_takedawn_x87_bcd.sh
          GAMEPKG_TABLES_PORTABLE_ONLY=1 bash tools/check_takedawn_tables.sh
          GAMEPKG_TABLE_DISPATCH_PORTABLE_ONLY=1 bash tools/check_takedawn_table_dispatch.sh
          GAMEPKG_FAR_JUMP_PORTABLE_ONLY=1 bash tools/check_takedawn_far_jump.sh
          GAMEPKG_FAR_MEMORY_PORTABLE_ONLY=1 bash tools/check_takedawn_far_memory.sh
          GAMEPKG_CPU_CODE_PORTABLE_ONLY=1 bash tools/check_takedawn_cpu_code.sh
          GAMEPKG_CPU_RETURN_PORTABLE_ONLY=1 bash tools/check_takedawn_cpu_return.sh
          GAMEPKG_KERNEL_IMAGE_PORTABLE_ONLY=1 bash tools/check_takedawn_kernel_image.sh
          GAMEPKG_PROCESSOR_PORTABLE_ONLY=1 bash tools/check_takedawn_processor.sh
          GAMEPKG_SHUTDOWN_PORTABLE_ONLY=1 bash tools/check_takedawn_shutdown.sh
          GAMEPKG_KERNEL_PRIORITY_PORTABLE_ONLY=1 bash tools/check_takedawn_kernel_priority.sh
          GAMEPKG_DISPATCHER_OBJECT_PORTABLE_ONLY=1 bash tools/check_takedawn_dispatcher_object.sh
          GAMEPKG_NV_PORTABLE_ONLY=1 bash tools/check_takedawn_nv.sh
          GAMEPKG_TIMER_PORTABLE_ONLY=1 bash tools/check_takedawn_timer.sh
          GAMEPKG_JUMP_TABLE_PORTABLE_ONLY=1 bash tools/check_takedawn_jump_table.sh
          GAMEPKG_VIRTUAL_PAGES_PORTABLE_ONLY=1 bash tools/check_takedawn_virtual_pages.sh
          GAMEPKG_VIRTUAL_MEMORY_PORTABLE_ONLY=1 bash tools/check_takedawn_virtual_memory.sh
          GAMEPKG_IO_PORTABLE_ONLY=1 bash tools/check_takedawn_io.sh
          GAMEPKG_STATUS_PORTABLE_ONLY=1 bash tools/check_takedawn_status.sh
          GAMEPKG_FAR_DISPATCH_PORTABLE_ONLY=1 bash tools/check_takedawn_far_dispatch.sh
          GAMEPKG_NEAR_DISPATCH_PORTABLE_ONLY=1 bash tools/check_takedawn_near_dispatch.sh
          GAMEPKG_CPU_PORTABLE_ONLY=1 bash tools/check_takedawn_cpu.sh
          GAMEPKG_SELECTION_CORPUS_SOURCE="$RUNNER_TEMP/gamepkg-selection-corpus.bin" GAMEPKG_SELECTION_PORTABLE_ONLY=1 bash tools/check_takedawn_selection.sh
          GAMEPKG_PREDICATE_CORPUS_SOURCE="$RUNNER_TEMP/gamepkg-predicate-corpus.bin" GAMEPKG_PREDICATE_PORTABLE_ONLY=1 bash tools/check_takedawn_predicate.sh
      - name: Compile and link Windows mixed-compiler guest ABI fixtures
        if: matrix.features == '--all-features'
        run: |
          sudo apt-get update && sudo apt-get install -y clang gcc-mingw-w64-i686
          GAMEPKG_CLANG=clang GAMEPKG_WINDOWS_TLS_LINK_ONLY=1 bash tools/check_takedawn_windows_tls.sh
          GAMEPKG_CLANG=clang GAMEPKG_FP_CONTEXT_LINK_ONLY=1 bash tools/check_takedawn_fp_context.sh
          GAMEPKG_CLANG=clang GAMEPKG_STACK_FAULT_LINK_ONLY=1 bash tools/check_takedawn_stack_fault.sh
          GAMEPKG_CLANG=clang GAMEPKG_FLAGS_LINK_ONLY=1 bash tools/check_takedawn_flags.sh
          GAMEPKG_CLANG=clang GAMEPKG_STRINGS_LINK_ONLY=1 bash tools/check_takedawn_strings.sh
          GAMEPKG_CLANG=clang GAMEPKG_STRING_CHECKPOINTS_LINK_ONLY=1 bash tools/check_takedawn_string_checkpoints.sh
          GAMEPKG_CLANG=clang GAMEPKG_ATOMICS_LINK_ONLY=1 bash tools/check_takedawn_atomics.sh
          GAMEPKG_CLANG=clang GAMEPKG_APPROX_LINK_ONLY=1 bash tools/check_takedawn_approx.sh
          GAMEPKG_CLANG=clang GAMEPKG_DISPATCH_LINK_ONLY=1 bash tools/check_takedawn_dispatch.sh
          GAMEPKG_CLANG=clang GAMEPKG_MEMORY_WINDOWS_LINK_ONLY=1 bash tools/check_takedawn_memory_windows.sh
          GAMEPKG_CLANG=clang GAMEPKG_INTERRUPTS_LINK_ONLY=1 bash tools/check_takedawn_interrupts.sh
          GAMEPKG_CLANG=clang GAMEPKG_IRQ_FLAGS_LINK_ONLY=1 bash tools/check_takedawn_irq_flags.sh
          GAMEPKG_CLANG=clang GAMEPKG_HARDWARE_INFO_LINK_ONLY=1 bash tools/check_takedawn_hardware_info.sh
          GAMEPKG_CLANG=clang GAMEPKG_BCD_LINK_ONLY=1 bash tools/check_takedawn_x87_bcd.sh
          GAMEPKG_CLANG=clang GAMEPKG_TABLES_LINK_ONLY=1 bash tools/check_takedawn_tables.sh
          GAMEPKG_CLANG=clang GAMEPKG_TABLE_DISPATCH_LINK_ONLY=1 bash tools/check_takedawn_table_dispatch.sh
          GAMEPKG_CLANG=clang GAMEPKG_FAR_JUMP_LINK_ONLY=1 bash tools/check_takedawn_far_jump.sh
          GAMEPKG_CLANG=clang GAMEPKG_FAR_MEMORY_LINK_ONLY=1 bash tools/check_takedawn_far_memory.sh
          GAMEPKG_CLANG=clang GAMEPKG_CPU_CODE_LINK_ONLY=1 bash tools/check_takedawn_cpu_code.sh
          GAMEPKG_CLANG=clang GAMEPKG_CPU_RETURN_LINK_ONLY=1 bash tools/check_takedawn_cpu_return.sh
          GAMEPKG_CLANG=clang GAMEPKG_KERNEL_IMAGE_LINK_ONLY=1 bash tools/check_takedawn_kernel_image.sh
          GAMEPKG_CLANG=clang GAMEPKG_PROCESSOR_LINK_ONLY=1 bash tools/check_takedawn_processor.sh
          GAMEPKG_CLANG=clang GAMEPKG_SHUTDOWN_LINK_ONLY=1 bash tools/check_takedawn_shutdown.sh
          GAMEPKG_CLANG=clang GAMEPKG_KERNEL_PRIORITY_LINK_ONLY=1 bash tools/check_takedawn_kernel_priority.sh
          GAMEPKG_CLANG=clang GAMEPKG_DISPATCHER_OBJECT_LINK_ONLY=1 bash tools/check_takedawn_dispatcher_object.sh
          GAMEPKG_CLANG=clang GAMEPKG_NV_LINK_ONLY=1 bash tools/check_takedawn_nv.sh
          GAMEPKG_CLANG=clang GAMEPKG_TIMER_LINK_ONLY=1 bash tools/check_takedawn_timer.sh
          GAMEPKG_CLANG=clang GAMEPKG_JUMP_TABLE_LINK_ONLY=1 bash tools/check_takedawn_jump_table.sh
          GAMEPKG_CLANG=clang GAMEPKG_VIRTUAL_PAGES_LINK_ONLY=1 bash tools/check_takedawn_virtual_pages.sh
          GAMEPKG_CLANG=clang GAMEPKG_VIRTUAL_MEMORY_LINK_ONLY=1 bash tools/check_takedawn_virtual_memory.sh
          GAMEPKG_CLANG=clang GAMEPKG_IO_LINK_ONLY=1 bash tools/check_takedawn_io.sh
          GAMEPKG_CLANG=clang GAMEPKG_STATUS_LINK_ONLY=1 bash tools/check_takedawn_status.sh
          GAMEPKG_CLANG=clang GAMEPKG_FAR_DISPATCH_LINK_ONLY=1 bash tools/check_takedawn_far_dispatch.sh
          GAMEPKG_CLANG=clang GAMEPKG_NEAR_DISPATCH_LINK_ONLY=1 bash tools/check_takedawn_near_dispatch.sh
          GAMEPKG_CLANG=clang GAMEPKG_CPU_LINK_ONLY=1 bash tools/check_takedawn_cpu.sh
          GAMEPKG_CLANG=clang GAMEPKG_SELECTION_LINK_ONLY=1 bash tools/check_takedawn_selection.sh
          GAMEPKG_CLANG=clang GAMEPKG_PREDICATE_LINK_ONLY=1 bash tools/check_takedawn_predicate.sh
          GAMEPKG_CLANG=clang GAMEPKG_X87_MEMORY_FIXTURE_SOURCE="$RUNNER_TEMP/gamepkg-x87-memory-fixture.c" GAMEPKG_X87_MEMORY_LINK_ONLY=1 bash tools/check_takedawn_x87_memory_targets.sh
          GAMEPKG_CLANG=clang GAMEPKG_X87_COMPARE_FIXTURE_SOURCE="$RUNNER_TEMP/gamepkg-x87-compare-fixture.c" GAMEPKG_X87_COMPARE_LINK_ONLY=1 bash tools/check_takedawn_x87_compare_targets.sh
          GAMEPKG_CLANG=clang GAMEPKG_X87_STORE_FIXTURE_SOURCE="$RUNNER_TEMP/gamepkg-x87-store-fixture.c" GAMEPKG_X87_STORE_LINK_ONLY=1 bash tools/check_takedawn_x87_store_targets.sh
          GAMEPKG_CLANG=clang GAMEPKG_X87_ENVIRONMENT_FIXTURE_SOURCE="$RUNNER_TEMP/gamepkg-x87-environment-fixture.c" GAMEPKG_X87_ENVIRONMENT_LINK_ONLY=1 bash tools/check_takedawn_x87_environment_targets.sh
          GAMEPKG_CLANG=clang GAMEPKG_X87_TRIG_PUSH_LINK_ONLY=1 bash tools/check_takedawn_x87_trig_push_targets.sh
          GAMEPKG_CLANG=clang GAMEPKG_X87_SINCOS_LINK_ONLY=1 bash tools/check_takedawn_x87_sincos_targets.sh
          GAMEPKG_CLANG=clang GAMEPKG_X87_FPATAN_LINK_ONLY=1 bash tools/check_takedawn_x87_fpatan_targets.sh
          GAMEPKG_CLANG=clang GAMEPKG_X87_FYL2XP1_LINK_ONLY=1 bash tools/check_takedawn_x87_fyl2xp1_targets.sh
          GAMEPKG_CLANG=clang GAMEPKG_X87_FYL2X_LINK_ONLY=1 bash tools/check_takedawn_x87_fyl2x_targets.sh
          GAMEPKG_CLANG=clang GAMEPKG_X87_F2XM1_LINK_ONLY=1 bash tools/check_takedawn_x87_f2xm1_targets.sh
          GAMEPKG_CLANG=clang GAMEPKG_F128_LINK_ONLY=1 bash tools/check_takedawn_f128_targets.sh
          GAMEPKG_CLANG=clang GAMEPKG_X87_REMAINDER_FIXTURE_SOURCE="$RUNNER_TEMP/gamepkg-x87-remainder-fixture.c" GAMEPKG_X87_REMAINDER_LINK_ONLY=1 bash tools/check_takedawn_x87_remainder_targets.sh
          GAMEPKG_CLANG=clang GAMEPKG_X87_SCALE_FIXTURE_SOURCE="$RUNNER_TEMP/gamepkg-x87-scale-fixture.c" GAMEPKG_X87_SCALE_LINK_ONLY=1 bash tools/check_takedawn_x87_scale_targets.sh
          GAMEPKG_CLANG=clang GAMEPKG_X87_STACK_FIXTURE_SOURCE="$RUNNER_TEMP/gamepkg-x87-stack-fixture.c" GAMEPKG_X87_STACK_LINK_ONLY=1 bash tools/check_takedawn_x87_stack_targets.sh
      - name: Verify optional decoder embedding bounds and input reset
        run: python3 tests/embedded_audio_build.py
      - name: Test
        run: cargo test --locked ${{ matrix.features }}
      - name: Compare mono and stereo streaming conversion with actual SDL
        if: matrix.features == '--all-features'
        run: |
          python3 tools/check_mono_music_schedule.py
          cc -std=c11 -Wall -Wextra -Werror tools/audio-decoder/resample_reference.c -o target/sdl-resample-reference $(pkg-config --cflags --libs sdl2)
          GAMEPKG_SDL_RESAMPLE_REFERENCE="$PWD/target/sdl-resample-reference" cargo test --locked --all-features --test audio_resampler -- --ignored
      - name: Verify stereo audio callback and wire bounds without game assets
        run: |
          g++ -pthread -Wall -Wextra -Werror tests/cube2_audio_bridge.cpp -o target/cube2-audio-bridge-test
          target/cube2-audio-bridge-test
          cc -Wall -Wextra -Werror -fsanitize=address,undefined tests/doom_audio.c -o target/doom-audio-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 target/doom-audio-test
      - name: Verify original linked sound-name table
        run: |
          cc -Wall -Wextra -Werror -fsanitize=address,undefined tests/doom_sound_names.c -o target/doom-sound-names
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 target/doom-sound-names
      - name: Verify original sound channel allocation and priority
        run: |
          cc -O1 -g -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Wl,--gc-sections -fsanitize=address,undefined tests/doom_sound_channels.c -o target/doom-sound-channels
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 target/doom-sound-channels
      - name: Verify original sound-ID boundaries and valid dispatch
        run: python3 tools/check_doom_sound_ids.py
      - name: Verify original supported and disabled music devices
        run: python3 tools/check_doom_music_devices.py
      - name: Verify portable original Zelda DMA save-state component
        run: python3 tools/check_zelda_dma_state.py
      - name: Verify portable original Zelda DSP save-state component
        run: python3 tools/check_zelda_dma_state.py --component dsp
      - name: Verify portable original Zelda PPU save-state component
        run: python3 tools/check_zelda_dma_state.py --component ppu
      - name: Verify bounded whole Zelda snapshot callbacks
        run: python3 tools/check_zelda_snapshot.py
      - name: Verify portable original Zelda SPC RAM words
        run: |
          python3 tools/check_zelda_spc_state.py
          python3 tools/check_zelda_spc_state.py --playback
          python3 tools/check_controller_look.py
      - name: Verify production touch camera with real egui
        if: matrix.features == '--all-features'
        run: |
          cargo fetch --locked
          python3 tools/check_touch_look.py
          python3 tools/check_touch_look.py --cancellation
      - name: Verify bounded replay decoding against the original reader
        if: matrix.features == '--all-features'
        run: python3 tools/check_zelda_replay.py
      - name: Install big-endian source portability tools
