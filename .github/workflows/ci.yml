name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "--all-features"]
    steps:
      - uses: actions/checkout@v4
      - name: Install preview codecs
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Rust tools
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Install audio development headers
        if: matrix.features == '--all-features'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked ${{ matrix.features }}
      - name: Lint
        run: cargo clippy --locked --all-targets ${{ matrix.features }} -- -D warnings
      - name: Build CLI and GUI
        if: matrix.features == '--all-features'
        run: cargo build --locked --release --all-features --bins
      - name: Local HTTPS integration
        if: matrix.features == '--all-features'
        run: python3 tests/https_download.py
      - name: Tor routing integration
        if: matrix.features == '--all-features'
        run: python3 tests/tor_download.py
      - name: Install isolated build prerequisites
        if: matrix.features == '--all-features'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap && rustup target add wasm32-unknown-unknown
      - name: Install pinned shader compiler
        if: matrix.features == '--all-features'
        run: |
          python3 tools/install_slang.py "/tmp/gamepkg-slang"
          echo "GAMEPKG_SLANG_ROOT=/tmp/gamepkg-slang" >> "$GITHUB_ENV"
      - name: Install pinned DXC for DXIL shaders
        if: matrix.features == '--all-features'
        run: |
          python3 tools/install_dxc.py "/tmp/gamepkg-dxc"
          echo "GAMEPKG_DXC_ROOT=/tmp/gamepkg-dxc" >> "$GITHUB_ENV"
      - name: Stage compiler for privileged namespace tests
        if: matrix.features == '--all-features'
        run: |
          sudo cp -a "$(rustc --print sysroot)" /tmp/gamepkg-ci-toolchain
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup rustup toolchain link gamepkg-ci /tmp/gamepkg-ci-toolchain
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup rustup default gamepkg-ci
      # Hosted runners restrict unprivileged network namespace setup. These
      # controlled fixture tests run as root while bwrap still isolates the build.
      - name: Isolated compiler integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/isolated_build.py
      - name: Compile and play every good example
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/good_examples.py
      - name: Playable source build integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/playable.py
      - name: Signed WIT component integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/components_game.py
      - name: Compiler output limits and cache preservation
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/compiler_limits.py
      - name: Signed preview validation and decoding
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" python3 tests/previews.py
      - name: Playable entrypoint and failed-build cache preservation
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/build_entrypoints.py
      - name: Pinned approved guest dependency
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/approved_crate_game.py
      - name: Shared assets and HTTPS store transfer
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/shared_assets_game.py
      - name: Guest asset integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/runtime_assets.py
      - name: User ROM integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/runtime_rom.py
      - name: Scoped save integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/runtime_saves.py
      - name: Pinned shader integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" GAMEPKG_DXC_ROOT="$GAMEPKG_DXC_ROOT" python3 tests/shaders.py
      - name: Guest drawing integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/drawing_game.py
      - name: Install virtual display tools
        if: matrix.features == '--all-features'
        run: sudo apt-get install -y xvfb xdotool imagemagick python3-pil libxkbcommon-x11-0 libgl1-mesa-dri
      - name: Verify desktop Settings approval persistence and cancellation
        if: matrix.features == '--all-features'
        run: python3 tests/settings_gui.py
      - name: Verify desktop store import review and approval
        if: matrix.features == '--all-features'
        run: python3 tests/store_gui.py
      - name: Verify video previews and Theora fallback in the GUI
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" /usr/bin/python3 tests/previews_gui.py
      - name: Verify periodic signed update checks in the GUI
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" /usr/bin/python3 tests/updates_gui.py
      - name: Verify guest drawing in the GUI
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/drawing_gui.py
      - name: Verify WIT component gameplay in the GUI
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/component_gui.py
      - name: Verify compiled package shaders in the GUI
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py
      - name: Verify WIT component shader passes
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/shader_gui.py --component

      - name: Null audio output integration
        if: matrix.features == '--all-features'
        run: |
          echo 'pcm.!default { type null }' > "$RUNNER_TEMP/gamepkg-null-alsa.conf"
          ALSA_CONFIG_PATH="$RUNNER_TEMP/gamepkg-null-alsa.conf" cargo test --locked --all-features audio_output_null_device -- --ignored --test-threads=1
      - name: Signed guest audio integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/audio_game.py
      - name: Verify GUI audio and mute on a null device
        if: matrix.features == '--all-features'
        run: |
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/audio_gui.py
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/audio_gui.py --muted
