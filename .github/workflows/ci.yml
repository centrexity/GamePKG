name: Rust checks
on:
  push:
    paths-ignore: ['README.md', 'DESIGN.md', 'docs/**', 'html/**', '.github/workflows/pages.yml', 'tools/check_site.py']
  pull_request:
    paths-ignore: ['README.md', 'DESIGN.md', 'docs/**', 'html/**', '.github/workflows/pages.yml', 'tools/check_site.py']
permissions:
  contents: read
concurrency:
  group: gamepkg-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: gamepkg-ci-core
      - name: Verify private GUI tool environment
        run: python3 tests/gui_test_support_env_test.py
      - name: Install preview codecs
        run: bash tools/ci_ubuntu_apt.sh update && bash tools/ci_ubuntu_apt.sh install -y ffmpeg g++ libsdl2-dev openssl
      - name: Install Rust tools
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Verify standalone fixture dependency lookup
        run: python3 tests/test_cargo_artifacts.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify bit-exact optimized audio against the preserved baseline
        run: |
          mkdir -p target
          sha256sum -c tools/audio-resample-bench/source-lock.sha256
          rustc --edition=2021 -Dwarnings -C opt-level=3 tools/audio-resample-bench/main.rs -o target/audio-resample-compare
          target/audio-resample-compare --verify-only
          rustup target add wasm32-unknown-unknown
          rustc --edition=2021 -Dwarnings --target wasm32-unknown-unknown --crate-type cdylib -C opt-level=3 -C panic=abort -C link-arg=-zstack-size=1048576 -C link-arg=--max-memory=16777216 tools/audio-resample-bench/wasm.rs -o target/audio-resample-compare.wasm
          node tools/audio-resample-bench/check-wasm.cjs target/audio-resample-compare.wasm
      - name: Verify decoder upload scheduling and execution deadlines
        run: node tests/web_decoder_upload_deadlines.mjs
      - name: Verify optional decoder embedding bounds and input reset
        run: python3 tests/embedded_audio_build.py
      - name: Test
        run: |
          df -h . /tmp
          free -h
          cargo test --locked
      - name: Report build resources
        if: always()
        run: |
          df -h . /tmp
          free -h
      - name: Test browser guest path protections
        run: node tests/web_path_attacks.mjs
      - name: Test bounded compressed asset storage and ownership
        run: node tests/web_asset_store.mjs
      - name: Test fixed browser music FIFO and generation boundaries
        run: node tests/web_recorded_queue.mjs
      - name: Recorded audio guest command staging
        run: |
          node tests/web_recorded_controls.mjs
          node tests/web_recorded_output.mjs
      - name: Verify nearest single-texel pixel coverage
        run: node tests/web_nearest_pixels.mjs
      - name: Verify browser drawing clip policy
        run: |
          node tests/web_clipping.mjs
          node tests/web_clip_pixels.mjs
      - name: Verify generated and packaged filtered image bounds
        run: |
          node tests/web_linear_images.mjs
          node tests/web_precise_images.mjs
          node tests/web_image_cache.mjs
          node tests/web_render_resources.mjs
      - name: Verify browser frame timing and ordered input
        run: |
          node tests/web_frame_clock.mjs
          node tests/web_input_events.mjs
      - name: Verify browser random-value imports
        run: node tests/web_randomness.mjs
      - name: Verify browser keyboard edges and shared bindings
        run: node tests/web_keyboard.mjs
      - name: Verify browser window and file commit boundaries
        run: |
          node tests/web_start_identity.mjs
          node tests/web_window_control.mjs
          node tests/web_window_observation.mjs
          node tests/web_user_files.mjs
          node tests/web_window_commit.mjs
          node tests/web_output_commit.mjs
          node tests/web_render_cooperative.mjs
          node tests/web_save_chunks.mjs
          node tests/web_progress_store.mjs
      - name: Test support links and clipboard behavior
        run: node tests/support_page.mjs
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build CLI for headless verification
        run: cargo build --locked --release --bin gamepkg
  test-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up all-features prerequisites
        uses: ./.github/actions/gamepkg-ci-setup
        with:
          profile: gates
      - name: Verify private GUI tool environment
        run: python3 tests/gui_test_support_env_test.py
      - name: Verify standalone fixture dependency lookup
        run: python3 tests/test_cargo_artifacts.py
      - name: Verify original SDL music repeat count and callback continuity
        run: |
          mkdir -p target
          cc -Wall -Wextra -Werror tests/music_loops.c -o target/music-loops-reference $(pkg-config --cflags --libs SDL2_mixer sdl2)
          target/music-loops-reference
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify bit-exact optimized audio against the preserved baseline
        run: |
          mkdir -p target
          sha256sum -c tools/audio-resample-bench/source-lock.sha256
          rustc --edition=2021 -Dwarnings -C opt-level=3 tools/audio-resample-bench/main.rs -o target/audio-resample-compare
          target/audio-resample-compare --verify-only
          rustup target add wasm32-unknown-unknown
          rustc --edition=2021 -Dwarnings --target wasm32-unknown-unknown --crate-type cdylib -C opt-level=3 -C panic=abort -C link-arg=-zstack-size=1048576 -C link-arg=--max-memory=16777216 tools/audio-resample-bench/wasm.rs -o target/audio-resample-compare.wasm
          node tools/audio-resample-bench/check-wasm.cjs target/audio-resample-compare.wasm
  test-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up all-features prerequisites
        uses: ./.github/actions/gamepkg-ci-setup
        with:
          profile: unit
      - name: Verify decoder upload scheduling and execution deadlines
        run: node tests/web_decoder_upload_deadlines.mjs
      - name: Verify optional decoder embedding bounds and input reset
        run: python3 tests/embedded_audio_build.py
      - name: Test
        run: |
          df -h . /tmp
          free -h
          cargo test --locked --all-features
      - name: Report build resources
        if: always()
        run: |
          df -h . /tmp
          free -h
      - name: Compare mono and stereo streaming conversion with actual SDL
        run: |
          python3 tools/check_mono_music_schedule.py
          cc -std=c11 -Wall -Wextra -Werror tools/audio-decoder/resample_reference.c -o target/sdl-resample-reference $(pkg-config --cflags --libs sdl2)
          GAMEPKG_SDL_RESAMPLE_REFERENCE="$PWD/target/sdl-resample-reference" cargo test --locked --all-features --test audio_resampler -- --ignored
      - name: Verify production touch camera with real egui
        run: |
          cargo fetch --locked
          python3 tools/check_touch_look.py
          python3 tools/check_touch_look.py --cancellation
      - name: Test browser guest path protections
        run: node tests/web_path_attacks.mjs
      - name: Test bounded compressed asset storage and ownership
        run: node tests/web_asset_store.mjs
      - name: Test fixed browser music FIFO and generation boundaries
        run: node tests/web_recorded_queue.mjs
      - name: Recorded audio guest command staging
        run: |
          node tests/web_recorded_controls.mjs
          node tests/web_recorded_output.mjs
      - name: Verify nearest single-texel pixel coverage
        run: node tests/web_nearest_pixels.mjs
      - name: Verify browser drawing clip policy
        run: |
          node tests/web_clipping.mjs
          node tests/web_clip_pixels.mjs
      - name: Verify generated and packaged filtered image bounds
        run: |
          node tests/web_linear_images.mjs
          node tests/web_precise_images.mjs
          node tests/web_image_cache.mjs
          node tests/web_render_resources.mjs
      - name: Verify browser frame timing and ordered input
        run: |
          node tests/web_frame_clock.mjs
          node tests/web_input_events.mjs
      - name: Verify browser random-value imports
        run: node tests/web_randomness.mjs
      - name: Verify browser keyboard edges and shared bindings
        run: node tests/web_keyboard.mjs
      - name: Verify browser window and file commit boundaries
        run: |
          node tests/web_start_identity.mjs
          node tests/web_window_control.mjs
          node tests/web_window_observation.mjs
          node tests/web_user_files.mjs
          node tests/web_window_commit.mjs
          node tests/web_output_commit.mjs
          node tests/web_render_cooperative.mjs
          node tests/web_save_chunks.mjs
          node tests/web_progress_store.mjs
      - name: Test support links and clipboard behavior
        run: node tests/support_page.mjs
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
  test-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up all-features prerequisites
        uses: ./.github/actions/gamepkg-ci-setup
        with:
          profile: integration
      - name: Verify generated mono decoder worker and actual device callbacks
        run: python3 tools/check_mono_decoder.py --decoder "$GAMEPKG_BUNDLED_AUDIO_DECODER" --worker --null-device
      - name: Verify original codec provenance with generated private audio
        run: python3 tools/check_music_codec_precision.py --decoder "$GAMEPKG_BUNDLED_AUDIO_DECODER" --float-check
      - name: Verify embedded decoder
        run: |
          python3 tests/app_identity.py
          python3 tools/check_bundled_audio.py target/release
          python3 tests/audio_companion_metadata.py
      - name: Verify physical input capture isolation and ordering
        run: |
          python3 tests/desktop_input_capture.py
          python3 tools/check_native_touch_cancellation.py
      - name: Reject excessive Rust parser nesting without aborting the host
        run: python3 tests/parser_limits.py
      - name: Local HTTPS integration
        run: python3 tests/https_download.py
      - name: GitHub project download and signed update integration
        run: python3 tests/github_download.py
      - name: Tor routing integration
        run: python3 tests/tor_download.py
      # Hosted runners restrict unprivileged network namespace setup. These
      # controlled fixture tests run as root while bwrap still isolates the build.
      - name: External-engine filesystem, memory and network isolation
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" cargo test --locked --all-features --lib external_engine::build::tests::sandbox_caps_address_space_drops_network_and_keeps_the_root_read_only -- --ignored --exact --nocapture
      - name: Isolated compiler integration
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/isolated_build.py
      - name: Build an admitted signed native image package
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" python3 tests/native_build.py
      - name: Verify signed native indexed Slang builds and stale receipt rejection
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/native_build.py --indexed
      - name: Verify signed native textured-v2 Slang builds and stale receipt rejection
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/native_build.py --textured-v2
      - name: Shared signed native SDK assets and persistent saves
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" cargo test --locked --all-features --lib native::signed_fixture::signed_native_sdk_assets_saves_and_integrity -- --ignored --exact --nocapture
      - name: Verify legacy C engine packages are blocked before compilation
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" cargo test --locked --all-features --lib native::signed_fixture::legacy_c_engine_packages_install_but_cannot_build -- --exact --nocapture
      - name: Shared signed native shader build and host include denial
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" cargo test --locked --all-features --lib shaders::platform_tests::signed_native_shader_builds_and_denied_host_include -- --ignored --exact --nocapture
      - name: Signed core and component recorded-effect playback
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tools/check_effect_sdk.py
      - name: Signed core and component music playback and rollback
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tools/check_music_sdk.py
      - name: Muted music clocks and unavailable audio devices in real game windows
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/muted_music_gui.py
      - name: Recorded-effect game windows in Vulkan and OpenGL
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/recorded_effects_gui.py
      - name: Core and component networking
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/network_game.py
      - name: Signed core and component TCP listeners and cleanup
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/network_listener_game.py
      - name: Compile every good example and reject every bad example
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/good_examples.py
      - name: Verified isolated compiler worker exchange
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/build_worker.py
      - name: Playable source build integration
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/playable.py
      - name: Signed play history and achievement integration
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/progress_game.py
      - name: Multiple ROMs and integrity repair
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/integrity_roms.py
      - name: Restore shared assets from verified store bundles
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/integrity_store.py
      - name: Reject special and oversized files without blocking
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/special_files.py
      - name: Signed WIT component integration
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/components_game.py
      - name: Compiler output limits and cache preservation
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/compiler_limits.py
      - name: Signed preview validation and decoding
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" python3 tests/previews.py
      - name: Creator directory build and atomic source package publication
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/creator_build.py
      - name: Playable entrypoint and failed-build cache preservation
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/build_entrypoints.py
      - name: Dependency-free game APIs
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/approved_crate_game.py
      - name: Injected host API policy and both runtime profiles
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/wrapper_games.py
      - name: Slang texture and audio host APIs with both profiles and permission denial
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/media_wrappers.py
      - name: Shared assets and HTTPS store transfer
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/shared_assets_game.py
      - name: Guest asset integration
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/runtime_assets.py
      - name: User ROM integration
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/runtime_rom.py
      - name: Scoped save integration
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/runtime_saves.py
      - name: Pinned shader integration
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" GAMEPKG_DXC_ROOT="$GAMEPKG_DXC_ROOT" python3 tests/shaders.py
      - name: Guest drawing integration
        run: sudo --preserve-env=GAMEPKG_BUNDLED_AUDIO_DECODER,GAMEPKG_BUNDLED_AUDIO_CONVERTER env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/drawing_game.py
      - name: Preserve desktop screenshots after a failed integration
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gamepkg-desktop-failure-screenshots-integration
          path: |
            target/*.png
            target/homepage-failed-*.json
            target/roms-picker-output.jsonl
            target/roms-picker-starts.jsonl
            target/native-rom-picker-targets.jsonl
            target/remembered-roms-picker-output.jsonl
          retention-days: 7
          if-no-files-found: ignore
  test-gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
