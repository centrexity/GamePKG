name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "--all-features"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust tools
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked ${{ matrix.features }}
      - name: Lint
        run: cargo clippy --locked --all-targets ${{ matrix.features }} -- -D warnings
      - name: Build CLI and GUI
        if: matrix.features == '--all-features'
        run: cargo build --locked --release --all-features --bins
      - name: Local HTTPS integration
        if: matrix.features == '--all-features'
        run: python3 tests/https_download.py
      - name: Tor routing integration
        if: matrix.features == '--all-features'
        run: python3 tests/tor_download.py
      - name: Install isolated build prerequisites
        if: matrix.features == '--all-features'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap && rustup target add wasm32-unknown-unknown
      - name: Install pinned shader compiler
        if: matrix.features == '--all-features'
        run: |
          python3 tools/install_slang.py "$RUNNER_TEMP/gamepkg-slang"
          echo "GAMEPKG_SLANG_ROOT=$RUNNER_TEMP/gamepkg-slang" >> "$GITHUB_ENV"
      # Hosted runners restrict unprivileged network namespace setup. These
      # controlled fixture tests run as root while bwrap still isolates the build.
      - name: Isolated compiler integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/isolated_build.py
      - name: Playable source build integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/playable.py
      - name: Guest asset integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/runtime_assets.py
      - name: User ROM integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/runtime_rom.py
      - name: Scoped save integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/runtime_saves.py
      - name: Pinned shader integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/shaders.py
      - name: Guest drawing integration
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" python3 tests/drawing_game.py
      - name: Install virtual display tools
        if: matrix.features == '--all-features'
        run: sudo apt-get install -y xvfb xdotool imagemagick python3-pil
      - name: Verify guest drawing in the GUI
        if: matrix.features == '--all-features'
        run: sudo env PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT="$GAMEPKG_SLANG_ROOT" /usr/bin/python3 tests/drawing_gui.py
