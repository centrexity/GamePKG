name: Package Linux preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install host build dependencies
        run: bash tools/ci_ubuntu_apt.sh update && bash tools/ci_ubuntu_apt.sh install -y libasound2-dev libudev-dev
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Prepare locked compatibility-layer sources
        run: |
          cargo fetch --locked
          sdk_path="$RUNNER_TEMP/native-service-sdk.tar.gz"
          sdk_pin="$(python3 tools/native_service_sdk.py "$sdk_path")"
          echo "GAMEPKG_NATIVE_SDK_SHA256=$sdk_pin" >> "$GITHUB_ENV"
          echo "GAMEPKG_NATIVE_SDK_ARCHIVE=$sdk_path" >> "$GITHUB_ENV"
      - name: Build decoder companion
        run: |
          rustup target add wasm32-unknown-unknown
          python3 tools/build_audio_companion.py --github-env
      - name: Embed decoder in both host entry points
        run: cargo build --locked --release --all-features --bins
      - name: Verify embedded decoder
        run: python3 tools/check_bundled_audio.py target/release
      - name: Fetch metadata sources for dependency notices
        run: cargo fetch --locked
      - name: Package executables, setup tools, examples, and notices
        run: python3 tools/package_release.py dist --native-sdk "$GAMEPKG_NATIVE_SDK_ARCHIVE"
      - uses: actions/upload-artifact@v4
        with:
          name: gamepkg-linux-x86_64-preview
          path: dist/*
          if-no-files-found: error
