name: Native host portability
on:
  push:
    paths-ignore: ['README.md', 'DESIGN.md', 'docs/**', 'html/**', '.github/workflows/pages.yml', 'tools/check_site.py']
  pull_request:
    paths-ignore: ['README.md', 'DESIGN.md', 'docs/**', 'html/**', '.github/workflows/pages.yml', 'tools/check_site.py']
permissions:
  contents: read
concurrency:
  group: gamepkg-portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable
      - name: Select Rust
        run: rustup default stable
      - name: Build CLI and desktop entry points
        run: cargo build --locked --release --all-features --bins
      - name: Exercise verification, runtime, and portable host behavior
        run: cargo test --locked --all-features
      - name: Check portable implementation warnings
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Package Windows host distribution
        if: runner.os == 'Windows'
        run: |
          python tools/package_release.py "$env:RUNNER_TEMP/gamepkg-windows"
          $version = python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])'
          python tests/windows_package.py "$env:RUNNER_TEMP/gamepkg-windows/gamepkg-$version-windows-x86_64.zip"
      - name: Preserve verified Windows distribution
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: verified-gamepkg-windows-x86_64
          path: ${{ runner.temp }}/gamepkg-windows/*
          retention-days: 7
          if-no-files-found: error
