name: Native host portability
on:
  push:
    paths-ignore: ['README.md', 'DESIGN.md', 'docs/**', 'html/**', '.github/workflows/pages.yml', 'tools/check_site.py']
  pull_request:
    paths-ignore: ['README.md', 'DESIGN.md', 'docs/**', 'html/**', '.github/workflows/pages.yml', 'tools/check_site.py']
permissions:
  contents: read
concurrency:
  group: gamepkg-portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compiler-fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated compiler prerequisites
        run: sudo apt-get update && sudo apt-get install -y bubblewrap && rustup target add wasm32-unknown-unknown
      - name: Build compiler host
        run: cargo build --locked --release --bin gamepkg
      - name: Install pinned shader compiler
        run: python3 tools/install_slang.py /tmp/gamepkg-slang
      - name: Stage isolated toolchain
        run: |
          sudo cp -a "$(rustc --print sysroot)" /tmp/gamepkg-ci-toolchain
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup rustup toolchain link gamepkg-ci /tmp/gamepkg-ci-toolchain
          sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup rustup default gamepkg-ci
      - name: Prepare signed isolated compiler exchange
        run: sudo env PATH="$PATH" RUSTUP_HOME=/tmp/gamepkg-ci-rustup CARGO_HOME="$HOME/.cargo" GAMEPKG_SLANG_ROOT=/tmp/gamepkg-slang python3 tests/compiler_exchange.py prepare /tmp/gamepkg-native-exchange
      - name: Make verified fixture readable for artifact upload
        run: sudo chmod -R a+rX /tmp/gamepkg-native-exchange
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-compiler-exchange
          path: /tmp/gamepkg-native-exchange
          retention-days: 1
          if-no-files-found: error
  native:
    needs: compiler-fixture
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable
      - name: Select Rust
        run: rustup default stable
      - name: Build CLI and desktop entry points
        run: cargo build --locked --release --all-features --bins
      - uses: actions/download-artifact@v4
        with:
          name: isolated-compiler-exchange
          path: native-exchange-fixture
      - name: Play validated isolated compiler outputs on the native host
        run: python tests/compiler_exchange.py consume native-exchange-fixture
      - name: Exercise verification, runtime, and portable host behavior
        run: cargo test --locked --all-features
      - name: Check portable implementation warnings
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Select packaging Python
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package Windows host distribution
        if: runner.os == 'Windows'
        run: |
          python tests/package_zip.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_release.py "$env:RUNNER_TEMP/gamepkg-windows"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])'
          python tests/windows_package.py "$env:RUNNER_TEMP/gamepkg-windows/gamepkg-$version-windows-x86_64.zip"
      - name: Preserve verified Windows distribution
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: verified-gamepkg-windows-x86_64
          path: ${{ runner.temp }}/gamepkg-windows/*
          retention-days: 7
          if-no-files-found: error
